/* ============================== INTERACTIONS ============================== */
function bind(key) {
  const nav = $('#nav'); const onS = () => nav.classList.toggle('solid', scrollY > 20); onS(); addEventListener('scroll', onS, { passive: true }); cleanup.push(() => removeEventListener('scroll', onS));
  $('#langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('pro-lang', lang); render(); };
  const dr = $('#drawer'), bu = $('#burger');
  const setMenu = o => { dr.classList.toggle('open', o); dr.setAttribute('aria-hidden', !o); bu.setAttribute('aria-expanded', o); document.body.classList.toggle('menu-open', o); bu.setAttribute('aria-label', L(o ? UI.close : UI.menu)); };
  bu.onclick = () => setMenu(!dr.classList.contains('open'));
  dr.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
  const esc_ = e => { if (e.key === 'Escape') setMenu(false); }; addEventListener('keydown', esc_); cleanup.push(() => { removeEventListener('keydown', esc_); document.body.classList.remove('menu-open'); });

  // reveal
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  $$('.rv,.step').forEach(el => reduced ? el.classList.add('in') : io.observe(el)); cleanup.push(() => io.disconnect());

  // timeline progress
  const tl = $('#tl');
  if (tl) { const bar = $('.bar', tl); const onT = () => { const b = tl.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (innerHeight * .6 - b.top) / b.height)); bar.style.setProperty('--p', (p * 100).toFixed(1) + '%'); }; onT(); addEventListener('scroll', onT, { passive: true }); cleanup.push(() => removeEventListener('scroll', onT)); }

  // card spotlight + tilt
  $$('.svc').forEach(c => { c.addEventListener('pointermove', e => { const b = c.getBoundingClientRect(); const x = e.clientX - b.left, y = e.clientY - b.top; c.style.setProperty('--mx', x + 'px'); c.style.setProperty('--my', y + 'px'); if (!reduced && !mobile) c.style.transform = `perspective(900px) rotateX(${(y / b.height - .5) * -5}deg) rotateY(${(x / b.width - .5) * 6}deg)`; }); c.addEventListener('pointerleave', () => c.style.transform = ''); });

  // portfolio filters
  $$('.filters button').forEach(b => b.onclick = () => { $$('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b)); const f = b.dataset.f; $$('#works .work').forEach(w => w.hidden = f !== 'all' && w.dataset.cat !== f); });

  bindForm(); bind2(key);
  if (key === 'home') cleanup.push(hero3d());
}

function recommend(ind, obj, picks) {
  const sc = {}, why = {};
  const add = (id, n, r) => { sc[id] = (sc[id] || 0) + n; (why[id] = why[id] || []).includes(r) || why[id].push(r); };
  const I_ = indById(ind), O_ = OBJECTIVES.find(o => o.id === obj);
  if (I_) I_.services.forEach(([id]) => add(id, 3, 'ind'));
  if (O_) Object.entries(O_.s).forEach(([id, n]) => add(id, n, 'obj'));
  picks.forEach(id => add(id, 4, 'pick'));
  const ranked = Object.keys(sc).sort((a, b) => sc[b] - sc[a]);
  return { core: ranked.filter(id => sc[id] >= 5).slice(0, 3), support: ranked.filter(id => sc[id] >= 2 && sc[id] < 5).slice(0, 3), why, I_, O_ };
}

function renderRec() {
  const f = $('#xpForm'), out = $('#xpOut'); if (!f || !out) return;
  const fd = new FormData(f), ind = fd.get('ind'), obj = fd.get('obj'), picks = fd.getAll('svc');
  if (!ind || !obj) { out.innerHTML = `<h2 class="h3">${L(UI.recTitle)}</h2><p class="mut" style="margin-top:12px">${L(UI.recEmpty)}</p><div class="xp-ghost" aria-hidden="true"><i></i><i></i><i></i></div>`; return; }
  const r = recommend(ind, obj, picks);
  if (!r.core.length && r.support.length) r.core.push(r.support.shift());
  const reason = k => ({ ind: L(UI.fromIndustry), obj: L(UI.fromGoal), pick: L(UI.fromPick) })[k];
  const item = (id, tier) => { const s = svcById(id); return `<li class="${tier}"><a href="#s-${id}"><b>${L(s.title)}</b></a><span class="tier">${L(tier === 'core' ? UI.recCore : UI.recSupport)}</span><small>${L(UI.recWhy)} ${r.why[id].map(reason).join(' · ')}</small></li>`; };
  out.innerHTML = `<h2 class="h3">${L(UI.recTitle)}</h2><p class="mut" style="margin:8px 0 18px">${L(r.I_.name)} · ${L(r.O_.name)}</p>
    <ol class="rec">${r.core.map(id => item(id, 'core')).join('')}${r.support.map(id => item(id, 'support')).join('')}</ol>
    <p class="mut sm" style="margin-top:16px">${L(UI.recNote)}</p>
    <button type="button" class="btn btn-y" id="xpGo" style="margin-top:18px;width:100%">${L(UI.reqCustom)} ${I.arrow}</button>`;
  $('#xpGo').onclick = () => {
    const all = r.core.concat(r.support);
    prefill = { services: all, industry: IND_TO_CFG[ind], type: 'quote', desc: `${L(['مستكشف الخدمات', 'Service Explorer'])}: ${L(r.I_.name)} — ${L(r.O_.name)}\n${L(['المزيج المقترح', 'Suggested mix'])}: ${all.map(id => L(svcById(id).title)).join('، ')}\n` };
    location.hash = 'quote';
  };
}

function resolve(r) {
  if (r === 'studio') return studioRoute();
  if (!r || r === 'home' || r === 'main') return { page: pages.home(), title: null, desc: L(UI.heroSub), key: 'home' };
  const simple = { services: [UI.nav.services, UI.servicesSub], work: [UI.nav.work, UI.workSub], about: [UI.nav.about, ABOUT.lead], contact: [UI.nav.contact, UI.contactSub], industries: [UI.nav.industries, UI.industriesSub], explorer: [UI.explorer, UI.explorerSub], faq: [UI.faqTitle, GENERAL_FAQ[0][1]] };
  if (simple[r]) return { page: pages[r](), title: L(simple[r][0]), desc: L(simple[r][1]), key: r, faq: r === 'faq' ? GENERAL_FAQ : null };
  if (r === 'quote' || r === 'book') return { page: pages.contact(null, r), title: L(r === 'quote' ? UI.quote : UI.bookCall), desc: L(r === 'quote' ? UI.quoteSub : UI.bookSub), key: r };
  let m;
  if ((m = r.match(/^(contact|quote)-(\w+)$/)) && svcById(m[2])) return { page: pages.contact(m[2], m[1] === 'quote' ? 'quote' : 'contact'), title: L(m[1] === 'quote' ? UI.quote : UI.nav.contact), desc: L(UI.quoteSub), key: m[1] };
  if ((m = r.match(/^s-(\w+)$/)) && svcById(m[1])) { const s = svcById(m[1]); return { page: servicePage(s), title: L(s.title), desc: L(s.short), key: r, svc: s }; }
  if ((m = r.match(/^social-([\w-]+)$/))) { const p = SOCIAL.find(x => x.id === m[1]); if (p) return { page: platformPage('social', p), title: L(p.name), desc: L(p.hook), key: r }; }
  if ((m = r.match(/^ads-([\w-]+)$/))) { const p = ADS.find(x => x.id === m[1]); if (p) return { page: platformPage('ads', p), title: L(p.name), desc: L(p.hook), key: r }; }
  if ((m = r.match(/^google-(\w+)$/)) && gToolById(m[1])) { const g = gToolById(m[1]); return { page: googleToolPage(g), title: L(g.name), desc: L(g.hook), key: r }; }
  if ((m = r.match(/^industry-([\w-]+)$/)) && indById(m[1])) { const x = indById(m[1]); return { page: industryPage(x), title: L(x.name), desc: L(x.intro), key: r }; }
  const cr = CASE_ALIASES[r] || r; if ((m = cr.match(/^case-([\w-]+)$/)) && cById(m[1])) { const b = cById(m[1]); return { page: conceptPage(b), title: b.name + ' — ' + L(UI.conceptBadge), desc: L(b.tagline), key: 'case-' + b.id }; }
  return { page: pages.notfound(), title: L(UI.notFound), desc: '', key: '404' };
}

/* ============================== INTERACTIONS v2 ============================== */
function bind2(key) {
  // dynamic typography: word-by-word reveal on headings
  const hio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); hio.unobserve(e.target); } }), { threshold: .3 });
  $$('.h2, .svc-h1, .phero .h1').forEach(h => {
    if (h.children.length || reduced) return;
    const words = h.textContent.trim().split(/\s+/);
    h.setAttribute('aria-label', h.textContent.trim());
    h.innerHTML = words.map((w, i) => `<span class="w" aria-hidden="true" style="--i:${i}">${esc(w)}</span>`).join(' ');
    h.classList.add('sw'); hio.observe(h);
  });
  cleanup.push(() => hio.disconnect());

  // 3D visuals follow the pointer
  if (!reduced && !mobile) $$('.vis').forEach(v => {
    const in3 = $('.v3d', v); if (!in3) return;
    v.addEventListener('pointermove', e => { const b = v.getBoundingClientRect(); const x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5; in3.style.animation = 'none'; in3.style.transform = `rotateY(${x * 34}deg) rotateX(${-y * 24}deg)`; });
    v.addEventListener('pointerleave', () => { in3.style.transform = ''; in3.style.animation = ''; });
  });

  // horizontal rails
  $$('.rbtn').forEach(b => b.onclick = () => { const r = $('#' + b.dataset.rail); const card = r.firstElementChild; const step = card ? card.getBoundingClientRect().width + 16 : 300; const dir = +b.dataset.dir * (document.dir === 'rtl' ? -1 : 1); r.scrollBy({ left: dir * step, behavior: reduced ? 'auto' : 'smooth' }); });
  $$('.rail').forEach(r => r.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); r.scrollBy({ left: (e.key === 'ArrowRight' ? 1 : -1) * 320, behavior: 'smooth' }); } }));

  // pinned horizontal client journey
  const jr = $('#jr');
  if (jr) {
    const pin = $('.jr-pin', jr), track = $('.jr-track', jr), bar = $('.jr-prog i', jr);
    let over = 0, active = false;
    const size = () => { active = !reduced && innerWidth > 900 && !jr.classList.contains('lite'); jr.classList.toggle('pinned', active); if (!active) { jr.style.height = ''; track.style.transform = ''; return; } over = Math.max(0, track.scrollWidth - pin.clientWidth); jr.style.height = (innerHeight + over) + 'px'; onS(); };
    const onS = () => { const b = jr.getBoundingClientRect(); const p = active && over ? Math.min(1, Math.max(0, -b.top / over)) : (Math.min(1, Math.max(0, (innerHeight - b.top) / (b.height + innerHeight)))); if (active) track.style.transform = `translate3d(${(document.dir === 'rtl' ? 1 : -1) * p * over}px,0,0)`; bar.style.transform = `scaleX(${p})`; $$('.jcard', track).forEach((c, i, a) => c.classList.toggle('on', p >= i / a.length - .02)); };
    size(); addEventListener('resize', size); addEventListener('scroll', onS, { passive: true });
    cleanup.push(() => { removeEventListener('resize', size); removeEventListener('scroll', onS); });
  }

  // website type tabs + device
  const tabs = $$('.wt-tabs [role=tab]');
  const bindDev = () => {
    const dev = $('#dev'), inn = $('#devIn'); if (!dev) return;
    $$('[data-dev]').forEach(b => b.onclick = () => { $$('[data-dev]').forEach(x => x.setAttribute('aria-pressed', x === b)); dev.dataset.mode = b.dataset.dev; });
    let drag = null, ry = -14, rx = 6; const apply = () => inn.style.transform = `rotateY(${ry}deg) rotateX(${rx}deg)`; apply();
    dev.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY, ry, rx]; dev.setPointerCapture(e.pointerId); });
    dev.addEventListener('pointermove', e => { if (!drag) return; ry = Math.max(-40, Math.min(40, drag[2] + (e.clientX - drag[0]) * .3)); rx = Math.max(-20, Math.min(25, drag[3] - (e.clientY - drag[1]) * .2)); apply(); });
    dev.addEventListener('pointerup', () => drag = null); dev.addEventListener('pointercancel', () => drag = null);
    const rg = $('#baRange'); if (rg) { const set = () => $('#mNew').style.clipPath = document.dir === 'rtl' ? `inset(0 ${rg.value}% 0 0)` : `inset(0 0 0 ${rg.value}%)`; rg.oninput = set; set(); rg.addEventListener('pointerdown', e => e.stopPropagation()); }
  };
  const selTab = (i, focus) => { tabs.forEach((t, j) => { t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; }); const p = $('#wtPanel'); p.setAttribute('aria-labelledby', 'wt-t' + i); p.innerHTML = webPanel(i); p.classList.remove('swap'); void p.offsetWidth; p.classList.add('swap'); bindDev(); if (focus) tabs[i].focus(); };
  tabs.forEach((t, i) => { t.onclick = () => selTab(i); t.onkeydown = e => { const k = e.key, rtl = document.dir === 'rtl'; let n = null; if (k === (rtl ? 'ArrowLeft' : 'ArrowRight')) n = (i + 1) % tabs.length; if (k === (rtl ? 'ArrowRight' : 'ArrowLeft')) n = (i - 1 + tabs.length) % tabs.length; if (k === 'Home') n = 0; if (k === 'End') n = tabs.length - 1; if (n !== null) { e.preventDefault(); selTab(n, true); } }; });
  bindDev();

  // explorer
  bindPortfolio();
  bindStudio(key);
  bindHScroll();
  bindWebDev();
  if ($('#xpForm')) { $('#xpForm').addEventListener('change', renderRec); renderRec(); }
  $$('[data-ind]').forEach(a => a.addEventListener('click', () => { explorerPreset = a.dataset.ind; }));
}

/* ---------- behaviour ---------- */
// Performance: phones, data-saver and slow connections get posters only (tap to play in the viewer).
const lowData = () => innerWidth < 700 || !!(navigator.connection && (navigator.connection.saveData || /(^|-)2g|3g/.test(navigator.connection.effectiveType || '')));
function bindStudio(key) {
  const root = document.querySelector('.studio, .st-home'); if (!root) return;
  const offs = [];
  // posters load only when their block approaches the viewport
  const pio = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; $$('video[data-poster]', e.target).forEach(v => { v.poster = v.dataset.poster; v.removeAttribute('data-poster'); }); pio.unobserve(e.target); }), { rootMargin: '300px' });
  $$('.st-car, .st-card').forEach(x => pio.observe(x)); offs.push(() => pio.disconnect());
  // lazy video: attach src only when visible, play only while visible (and not reduced motion)
  const vio = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if (e.isIntersecting) { if (!v.src && v.dataset.src) v.src = v.dataset.src; if (!reduced && v.dataset.auto !== '0') v.play().catch(() => {}); } else v.pause(); }), { rootMargin: '120px' });
  $$('.st-card video').forEach(v => { v.dataset.auto = '0'; });
  $$('.st-card .st-thumb').forEach(b => {
    const v = b.querySelector('video');
    const on = () => { if (reduced || lowData()) return; if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); }, off = () => v.pause();
    b.addEventListener('pointerenter', on); b.addEventListener('pointerleave', off); b.addEventListener('focus', on); b.addEventListener('blur', off);
  });
  // 3D carousels: JS rotation, play only the front screen
  $$('.st-car').forEach(car => {
    const ring = car.querySelector('.st-ring'), screens = $$('.st-screen', car), vids = screens.map(s => s.querySelector('video')), n = screens.length;
    let a = 0, raf = 0, last = 0, visible = false, front = -1, drag = null, vel = 0;
    const place = () => { ring.style.transform = `translateZ(calc(var(--r) * -1)) rotateY(${a}deg)`;
      const f = ((Math.round(-a / (360 / n)) % n) + n) % n;
      if (f !== front) { front = f; vids.forEach((v, i) => { if (i === f && visible && !reduced && !lowData()) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause(); }); screens.forEach((s, i) => s.classList.toggle('front', i === f)); } };
    const tick = t => { const dt = Math.min(50, t - (last || t)); last = t; if (drag === null) { a -= dt * .012 + vel; vel *= .94; } place(); if (visible && !reduced) raf = requestAnimationFrame(tick); };
    const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; front = -1; if (visible && !reduced) { cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(tick); } else { cancelAnimationFrame(raf); vids.forEach(v => v.pause()); } place(); }); io.observe(car);
    car.addEventListener('pointerdown', e => { drag = e.clientX; car.setPointerCapture && car.setPointerCapture(e.pointerId); });
    car.addEventListener('pointermove', e => { if (drag === null) return; const d = (e.clientX - drag) * .35; a += d; vel = -d * .05; drag = e.clientX; if (reduced) place(); });
    const up = () => { drag = null; }; car.addEventListener('pointerup', up); car.addEventListener('pointercancel', up);
    place();
    offs.push(() => { cancelAnimationFrame(raf); io.disconnect(); vids.forEach(v => v.pause()); });
  });
  // in-page scroll buttons
  root.addEventListener('click', e => { const b = e.target.closest('[data-scroll]'); if (!b) return; const t = document.querySelector(b.dataset.scroll); if (t) t.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); });
  if (key !== 'studio') { cleanup.push(() => offs.forEach(f => f())); return; }

  // filters
  const grid = $('#stGrid');
  $$('.st-f').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.cat; $$('.st-f').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    $$('.st-card', grid).forEach(card => { card.hidden = c !== 'all' && !card.dataset.cats.split(' ').includes(c); });
    $$('.st-slot', grid).forEach(s => { s.hidden = s.dataset.slot !== c; });
  }));
  // lightbox
  const lb = $('#stLb'), lv = $('#stLbVideo');
  const open = id => { const v = REEL.find(x => x.id === id); if (!v) return; lv.poster = v.poster; lv.src = v.src; $('#stLbT').textContent = L(v.title); $('#stLbD').textContent = L(v.desc);
    if (lb.showModal) lb.showModal(); else lb.setAttribute('open', ''); lv.play().catch(() => {}); };
  const close = () => { lv.pause(); if (lb.close) lb.close(); else lb.removeAttribute('open'); };
  grid.addEventListener('click', e => { const b = e.target.closest('[data-reel]'); if (b) open(b.dataset.reel); });
  $('#stLbX').onclick = close; lb.addEventListener('close', () => lv.pause()); lb.addEventListener('click', e => { if (e.target === lb) close(); });
  $('#stLbFull').onclick = () => { const f = lv.requestFullscreen || lv.webkitRequestFullscreen || lv.webkitEnterFullscreen; if (f) f.call(lv); };
  // voice players (real files only)
  let cur = null;
  $$('.st-vbtn').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.voice, src = CONFIG.voiceSamples[id]; if (!src) return;
    if (cur && cur.id === id) { if (cur.a.paused) { cur.a.play(); } else cur.a.pause(); return; }
    if (cur) { cur.a.pause(); }
    const a = new Audio(src); a.preload = 'auto'; cur = { id, a, b, cv: $(`canvas[data-wave="${id}"]`) };
    const sync = () => { const on = !a.paused; b.innerHTML = on ? SI.pause : SI.play; b.setAttribute('aria-label', L(on ? ST.pause : ST.play)); b.closest('.st-voice').classList.toggle('playing', on); };
    a.addEventListener('play', sync); a.addEventListener('pause', sync); a.addEventListener('ended', sync);
    a.play().catch(() => {});
  }));
  offs.push(() => { if (cur) cur.a.pause(); });
  bindStudioForm();
  cleanup.push(() => offs.forEach(f => f()));
}

function bindStudioForm() {
  const f = $('#stForm'); if (!f) return;
  const file = $('#st-file'), drop = $('#stDrop'), st = $('#stStatus'), btn = $('#stSend');
  const OKT = /^(image\/|application\/pdf$|video\/(mp4|quicktime)$|application\/(msword|zip|x-zip-compressed|vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|presentationml\.presentation)|vnd\.ms-powerpoint))/;
  let picked = null;
  const setErr = (k, m) => { const e = $('#st-e-' + k); if (e) e.textContent = m; const i = f.querySelector(`[name="${k}"]`); if (i) i.setAttribute('aria-invalid', m ? 'true' : 'false'); };
  const showFile = () => { $('#stDropT').innerHTML = picked ? `<b dir="auto">${esc(picked.name)}</b> · ${(picked.size / 1048576).toFixed(2)} MB <button type="button" class="st-rm" id="stRm">${L(ST.fRemove)}</button>` : L(ST.fDrop); drop.classList.toggle('has', !!picked); };
  const take = fl => { setErr('file', ''); picked = null;
    if (fl) { if (!OKT.test(fl.type || '') && !/\.(docx?|pptx?|zip|pdf|png|jpe?g|webp|mp4|mov)$/i.test(fl.name)) setErr('file', L(ST.fType)); else if (fl.size > 3 * 1048576) setErr('file', L(ST.fBig)); else picked = fl; }
    showFile(); };
  file.addEventListener('change', () => take(file.files[0]));
  drop.addEventListener('click', e => { if (e.target.id === 'stRm') { e.preventDefault(); picked = null; file.value = ''; showFile(); } });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => take(e.dataTransfer.files[0]));
  const b64 = fl => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(fl); });
  f.addEventListener('submit', async e => {
    e.preventDefault(); if (btn.disabled) return;
    const d = Object.fromEntries(new FormData(f)); let ok = true;
    if (!String(d.name || '').trim()) { setErr('name', L(ST.req)); ok = false; } else setErr('name', '');
    const ph = String(d.phone || '').replace(/[\s-]/g, '').replace(/^0+/, '');
    const phBad = !ph ? L(ST.req) : !/^\d{7,12}$/.test(ph) || (d.cc === '+966' && !/^5\d{8}$/.test(ph)) ? L(ST.badPhone) : ''; setErr('phone', phBad); if (phBad) ok = false;
    if (!d.service) { setErr('service', L(ST.req)); ok = false; } else setErr('service', '');
    if (!ok) { const bad = f.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); return; }
    if (d.website) return; // honeypot
    btn.disabled = true; btn.innerHTML = L(ST.sending); st.className = 'status'; st.textContent = '';
    const svcLabel = L((ST_SERVICES.find(x => x[0] === d.service) || [0, [d.service, d.service]])[1]);
    const lead = { requestType: 'studio', name: d.name.trim(), phone: d.cc + ph, service: d.service, services: [d.service], description: String(d.description || '').trim(), lang, page: '#studio' };
    if (picked) { try { lead.attachment = { name: picked.name, type: picked.type || 'application/octet-stream', size: picked.size, data: await b64(picked) }; } catch (x) { /* ignore */ } }
    let delivered = false;
    try { const r = await fetch(CONFIG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lead) }); const j = await r.json().catch(() => null); delivered = !!(r.ok && j && j.ok === true); } catch (x) { /* try next channel */ }
    if (!delivered && CONFIG.leadsEndpoint) { try { const r = await fetch(CONFIG.leadsEndpoint, { method: 'POST', body: JSON.stringify({ type: 'project', id: 'st-' + Date.now().toString(36), ...lead, ts: new Date().toISOString() }) }); const j = await r.json().catch(() => null); delivered = !!(r.ok && j && j.ok === true); } catch (x) { /* fall through */ } }
    btn.disabled = false; btn.innerHTML = `${L(ST.send)} ${I.arrow}`;
    if (delivered) { st.className = 'status ok'; st.textContent = L(ST.ok); f.reset(); picked = null; showFile(); }
    else { const sum = [`${L(ST.fName)}: ${lead.name}`, `${L(ST.fPhone)}: ${lead.phone}`, `${L(ST.fSvc)}: ${svcLabel}`, lead.description ? `${L(ST.fDesc)}: ${lead.description}` : '', picked ? `${L(ST.fFile)}: ${picked.name}` : ''].filter(Boolean).join('\n');
      st.className = 'status no'; st.innerHTML = `${esc(L(ST.fail))} <a ${stWaAttrs(sum)} style="text-decoration:underline">${L(UI.whatsapp)}</a>`; }
  });
}

function bindHScroll() {
  const jr = document.querySelector('.jr.lite'); if (!jr) return;
  const track = jr.querySelector('.jr-track'), bar = jr.querySelector('.jr-prog i');
  const step = () => { const c = track.querySelector('.jcard'); return c ? c.getBoundingClientRect().width + 16 : 320; };
  const prog = () => { const max = track.scrollWidth - track.clientWidth; const k = max > 0 ? Math.abs(track.scrollLeft) / max : 0; if (bar) bar.style.transform = `scaleX(${Math.max(.04, k).toFixed(3)})`;
    jr.querySelectorAll('.hs-btn').forEach(b => { b.disabled = b.dataset.hs === '-1' ? k <= .01 : k >= .99; }); };
  jr.querySelectorAll('.hs-btn').forEach(b => b.addEventListener('click', () => { const dir = +b.dataset.hs * (lang === 'ar' ? -1 : 1); track.scrollBy({ left: dir * step(), behavior: reduced ? 'auto' : 'smooth' }); }));
  track.addEventListener('scroll', prog, { passive: true }); addEventListener('resize', prog); prog();
  cleanup.push(() => removeEventListener('resize', prog));
}

function bindWebDev() {
  const root = document.querySelector('.wdev'); if (!root) return;
  root.addEventListener('click', e => { const b = e.target.closest('[data-wdscroll]'); if (!b) return; const t = document.querySelector(b.dataset.wdscroll); if (t) t.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); });
  // service lists: open on wide screens, collapsed on phones to keep the page short
  if (innerWidth > 700) $$('.wd-list', root).forEach(d => { d.open = true; });
  // process tabs
  const steps = $$('.wd-step', root), panel = $('#wdp-panel');
  let cur = 0, auto = 0, touched = false;
  const show = (i, focus) => { cur = (i + steps.length) % steps.length; steps.forEach((b, k) => { const on = k === cur; b.classList.toggle('on', on); b.classList.toggle('done', k < cur); b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
    const [en, t, d] = WD_PROC[cur]; panel.setAttribute('aria-labelledby', 'wdp-t' + cur);
    panel.innerHTML = `<div class="wd-pcard" style="--k:${cur}"><span class="wd-pn" dir="ltr">0${cur + 1}</span><div><small dir="ltr">${en}</small><h3>${L(t)}</h3><p>${L(d)}</p><div class="wd-pbar"><i style="width:${(cur + 1) / steps.length * 100}%"></i></div></div></div>`;
    if (focus) steps[cur].focus(); };
  steps.forEach((b, i) => { b.addEventListener('click', () => { touched = true; show(i); });
    b.addEventListener('keydown', e => { const k = e.key, rtl = lang === 'ar'; if (['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(k)) { e.preventDefault(); touched = true;
      show(k === 'Home' ? 0 : k === 'End' ? steps.length - 1 : cur + ((k === 'ArrowRight') !== rtl ? 1 : -1), true); } }); });
  show(0);
  const pio = new IntersectionObserver(([e]) => { clearInterval(auto); if (e.isIntersecting && !reduced) auto = setInterval(() => { if (!touched) show(cur + 1); }, 3800); }, { threshold: .4 });
  pio.observe($('.wd-proc', root));
  // portfolio filter
  const works = $$('.wd-work', root);
  $$('.wd-f', root).forEach(b => b.addEventListener('click', () => { const c = b.dataset.cat; $$('.wd-f', root).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    works.forEach(w => { w.hidden = c !== 'all' && w.dataset.cat !== c; }); }));
  bindWdForm();
  cleanup.push(() => { clearInterval(auto); pio.disconnect(); });
}
function bindWdForm() {
  const f = $('#wdF'); if (!f) return; const btn = $('#wdSend'), st = $('#wdStatus');
  const setErr = (k, m) => { const e = $('#wd-e-' + k); if (e) e.textContent = m; const i = f.querySelector(`[name="${k}"]`); if (i) i.setAttribute('aria-invalid', m ? 'true' : 'false'); };
  f.addEventListener('submit', async e => {
    e.preventDefault(); if (btn.disabled) return;
    const fd = new FormData(f), d = Object.fromEntries(fd), feats = fd.getAll('features'); let ok = true;
    ['name', 'activity', 'websiteType'].forEach(k => { const bad = !String(d[k] || '').trim(); setErr(k, bad ? L(WD.req) : ''); if (bad) ok = false; });
    const ph = String(d.phone || '').replace(/[\s-]/g, '').replace(/^0+/, '');
    const pe = !ph ? L(WD.req) : !/^\d{7,12}$/.test(ph) || (d.cc === '+966' && !/^5\d{8}$/.test(ph)) ? L(WD.badPhone) : ''; setErr('phone', pe); if (pe) ok = false;
    if (!ok) { const bad = f.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); return; }
    if (d.website) return; // honeypot
    btn.disabled = true; btn.innerHTML = L(WD.sending); st.className = 'status'; st.textContent = '';
    const lead = { requestType: 'web', name: d.name.trim(), phone: d.cc + ph, activity: d.activity.trim(), websiteType: d.websiteType, features: feats, service: 'Website — ' + d.websiteType, services: ['web'], description: String(d.description || '').trim(), lang, page: '#s-web' };
    let delivered = false;
    try { const r = await fetch(CONFIG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lead) }); const j = await r.json().catch(() => null); delivered = !!(r.ok && j && j.ok === true); } catch (x) { /* next channel */ }
    if (!delivered && CONFIG.leadsEndpoint) { try { const r = await fetch(CONFIG.leadsEndpoint, { method: 'POST', body: JSON.stringify({ type: 'project', id: 'web-' + Date.now().toString(36), ...lead, description: [`${L(WD.fAct)}: ${lead.activity}`, feats.length ? `${L(WD.fFeat)}: ${feats.join(', ')}` : '', lead.description].filter(Boolean).join('\n'), ts: new Date().toISOString() }) }); const j = await r.json().catch(() => null); delivered = !!(r.ok && j && j.ok === true); } catch (x) { /* fall through */ } }
    btn.disabled = false; btn.innerHTML = `${L(WD.send)} ${I.arrow}`;
    if (delivered) { st.className = 'status ok'; st.textContent = L(WD.ok); f.reset(); }
    else { const tl = L((WD_TYPES.find(x => x[0] === d.websiteType) || [0, [d.websiteType, d.websiteType]])[1]);
      const sum = [`${L(WD.fName)}: ${lead.name}`, `${L(WD.fPhone)}: ${lead.phone}`, `${L(WD.fAct)}: ${lead.activity}`, `${L(WD.fType)}: ${tl}`, feats.length ? `${L(WD.fFeat)}: ${feats.map(v => L((WD_FEAT.find(x => x[0] === v) || [0, [v, v]])[1])).join('، ')}` : '', lead.description ? `${L(WD.fDesc)}: ${lead.description}` : ''].filter(Boolean).join('\n');
      st.className = 'status no'; st.innerHTML = `${esc(L(WD.fail))} <a ${wdWaAttrs(sum)} style="text-decoration:underline">${L(UI.whatsapp)}</a>`; }
  });
}

  set(v) { try { localStorage.setItem(CB_KEY, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  clear() { try { localStorage.removeItem(CB_KEY); } catch (e) { /* ignore */ } }
};

const SVC_INTENTS = ['social', 'ads', 'web', 'brand', 'video', 'seo', 'google', 'crm', 'strategy'];
function cbAnswer(q) {
  const t = ' ' + nz(q) + ' ';
  const scored = [];
  for (const it of KB) {
    let s = 0;
    for (const k of it.nk) if (k && t.includes(k.length <= 3 ? ' ' + k + ' ' : k)) s += k.split(' ').length + (k.length > 5 ? 1 : 0);
    if (!s) continue;
    if (it.weak) s = 0.5; else if (it.boost) s += it.boost;
    scored.push([s, it]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  if (scored.length) {
    const best = scored[0][1];
    // "how much is X?" → pricing answer + a link to service X
    const svc = !SVC_INTENTS.includes(best.id) && scored.find(([, i]) => SVC_INTENTS.includes(i.id));
    if (svc && best.links) return { ...best, links: () => [...best.links(), ...svc[1].links()] };
    return best;
  }
  // fallback: site FAQs (general + per-service), matched by word overlap
  const words = nz(q).split(' ').filter(w => w.length > 2);
  if (!words.length) return null;
  const faqs = [...GENERAL_FAQ, ...SERVICES.flatMap(s => s.faq || [])];
  let fb = null, fs = 0;
  for (const [qq, aa] of faqs) {
    const n = nz(L(qq)); const s = words.filter(w => n.includes(w)).length / Math.max(3, words.length);
    if (s > fs) { fs = s; fb = aa; }
  }
  return fs >= 0.5 ? { id: 'faq', a: () => [fb] } : null;
}

async function cbPost(evt) {
  const url = CONFIG.leadsEndpoint;
  if (!url) return false;
  try {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const tm = ctl && setTimeout(() => ctl.abort(), 12000);
    // text/plain keeps this a "simple" request (no CORS preflight), which Google Apps Script requires
    const r = await fetch(url, { method: 'POST', body: JSON.stringify(evt), signal: ctl ? ctl.signal : undefined });
    if (tm) clearTimeout(tm);
    const j = await r.json().catch(() => null);
    return !!(r.ok && j && j.ok === true);
  } catch (e) { return false; }
}

      <button type="button" class="cb-hb" id="cbRestart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button type="button" class="cb-hb" id="cbClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="cb-body" id="cbBody" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="cb-chips" id="cbChips"></div>
    <form class="cb-form" id="cbForm" autocomplete="off"><label class="cb-sr" for="cbInput" id="cbInputLbl"></label>
      <input id="cbInput" name="m" maxlength="500" enterkeyhint="send">
      <button type="submit" class="cb-send" id="cbSend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form>
    <p class="cb-priv" id="cbPriv"></p>
  </section>`;
}
const $cb = id => document.getElementById(id);
function cbTexts() {
  const p = $cb('cbPanel'); if (!p) return;
  p.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $cb('cbTitle').textContent = L(CB.title); $cb('cbStatus').textContent = L(CB.status);
  $cb('cbLaunchLbl').textContent = L(CB.open); $cb('cbLaunch').setAttribute('aria-label', L(CB.open));
  $cb('cbClose').setAttribute('aria-label', L(CB.close)); $cb('cbClose').title = L(CB.close);
  $cb('cbRestart').setAttribute('aria-label', L(CB.restart)); $cb('cbRestart').title = L(CB.restart);
  $cb('cbInput').placeholder = L(CB.placeholder); $cb('cbInputLbl').textContent = L(CB.placeholder);
  $cb('cbSend').setAttribute('aria-label', L(CB.send)); $cb('cbPriv').textContent = L(CB.privacy);
  $cb('cbTeaserB').textContent = L(CB.teaser);
  const ph = cb.step === 'phone'; const inp = $cb('cbInput');
  inp.type = ph ? 'tel' : 'text'; inp.inputMode = ph ? 'tel' : 'text'; inp.autocomplete = ph ? 'tel' : cb.step === 'name' ? 'name' : 'off';
  inp.dir = ph ? 'ltr' : 'auto';
}
const fmt = t => esc(t).replace(/\n/g, '<br>');
function msgHTML(m) {
  if (m.from === 'user') return `<div class="cb-m cb-u"><div class="cb-bub" dir="auto">${fmt(m.t)}</div></div>`;
  const links = (m.links || []).filter(Boolean).map(([t, h]) => `<a class="cb-lk" href="${esc(h)}">${esc(t)} <span aria-hidden="true">${lang === 'ar' ? '←' : '→'}</span></a>`).join('');
  const wa = m.wa ? `<a class="cb-wa" href="${esc(m.wa)}" target="_blank" rel="noopener noreferrer" data-wa>${waIcon()}<span>${esc(m.waLabel || L(CB.talkHuman))}</span></a>` : '';
  return `<div class="cb-m cb-b">${CB_AV()}<div class="cb-col"><div class="cb-bub" dir="auto">${fmt(m.t)}</div>${links || wa ? `<div class="cb-acts">${links}${wa}</div>` : ''}</div></div>`;
}
function cbRenderAll() { const b = $cb('cbBody'); if (!b) return; b.innerHTML = cb.msgs.map(msgHTML).join(''); b.scrollTop = b.scrollHeight; }
function cbAppend(m) {
  cb.msgs.push(m); cbSave();
  const b = $cb('cbBody'); if (!b) return;
  b.insertAdjacentHTML('beforeend', msgHTML(m)); b.scrollTop = b.scrollHeight;
}
let cbBusy = false;
const cbReduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function cbTyping(on) {
  const b = $cb('cbBody'); if (!b) return;
  const t = $cb('cbTyping');
  if (on && !t) { b.insertAdjacentHTML('beforeend', `<div class="cb-m cb-b" id="cbTyping" aria-hidden="true">${CB_AV()}<div class="cb-bub cb-typing"><i></i><i></i><i></i></div></div>`); b.scrollTop = b.scrollHeight; }
  if (!on && t) t.remove();
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function bot(t, extra = {}) {
  cbTyping(true);
  await wait(cbReduced() ? 120 : Math.min(1100, 380 + String(t).length * 9));
  cbTyping(false);
  cbAppend({ from: 'bot', t, ...extra });
}
function cbChips() {
  const c = $cb('cbChips'); if (!c) return;
  let items = [];
  if (cb.step === 'biz') items = [['skip', L(CB.noBiz)]];
  else if (cb.step === 'city') items = [...CITIES.map(x => ['city', L(x)]), ['city-other', L(CB.other)]];
  else if (cb.step === 'svc') items = [...SERVICES.map(s => ['svc', L(s.title)]), ['svc', L(CB.notSure)]];
  else if (cb.step === 'done') items = QUICK.map(([id, t]) => ['q:' + id, L(t)]);
  c.innerHTML = items.map(([k, t]) => `<button type="button" class="cb-chip" data-k="${esc(k)}">${esc(t)}</button>`).join('');
  c.hidden = !items.length;
}
function askFor(step) {
  if (step === 'name') return bot(L(CB.askName));
  if (step === 'phone') return bot(L(CB.askPhone(cb.lead.name)));
  if (step === 'biz') return bot(L(CB.askBiz));
  if (step === 'city') return bot(L(CB.askCity));
  if (step === 'svc') return bot(L(CB.askSvc));
}
const looksLikeQuestion = t => /[?؟]/.test(t) || nz(t).split(' ').length >= 4 && !!cbAnswer(t);

async function cbStart() {
  if (cb.msgs.length) { cbRenderAll(); cbChips(); cbTexts(); return; }
  cbTexts(); cbChips();
  await bot(L(CB.hello));
  await askFor('name');
}
async function finishLead() {
  cb.step = 'saving'; cbSave(); cbChips();
  await bot(L(CB.saving));
  const ok = await cbPost({ type: 'lead', ...evtBase(), name: cb.lead.name, phone: cb.lead.phone, business: cb.lead.biz || '', city: cb.lead.city || '', service: cb.lead.svc || '' });
  cb.saved = ok; cb.step = 'done'; cbSave();
  if (ok) await bot(L(CB.saved(cb.lead.name)));
  else await bot(L(CB.notSaved), { wa: waWith(leadSummary()), waLabel: L(CB.sendWa) });
  if (cb.pendingQ) { const q = cb.pendingQ; cb.pendingQ = ''; cbSave(); await answer(q, true); }
  await bot(L(CB.nowAsk));
  cbChips();
}
async function answer(q, pending, forcedId) {
  const hit = (forcedId && KB.find(x => x.id === forcedId)) || cbAnswer(q);
  const prefix = pending ? L(CB.pendingQ) : '';
  if (hit) {
    const [a] = hit.a();
    await bot(prefix + L(a), { links: hit.links ? hit.links() : [], wa: hit.wa ? waWith(leadSummary() + '\n\n' + q) : '' });
  } else {
    const logged = cb.saved && await cbPost({ type: 'question', ...evtBase(), name: cb.lead.name, phone: cb.lead.phone, question: q, answered: false });
    if (logged) await bot(prefix + L(CB.unknownSaved));
    else await bot(prefix + L(CB.unknownWa), { wa: waWith(leadSummary() + '\n\n' + L(['سؤالي', 'My question']) + ': ' + q) });
    return;
  }
  if (cb.saved) cbPost({ type: 'question', ...evtBase(), name: cb.lead.name, phone: cb.lead.phone, question: q, answered: true, topic: hit.id });
}
async function cbHandle(text, chipKey) {
  if (cbBusy) return;
  const t = String(text || '').trim();
  if (!t) return;
  cbBusy = true; $cb('cbChips').hidden = true;
  try {
    cbAppend({ from: 'user', t });
    const step = cb.step;
    if (step === 'name') {
      if (looksLikeQuestion(t)) { cb.pendingQ = cb.pendingQ || t; cbSave(); await bot(L(CB.holdQ)); await askFor('name'); return; }
      const name = t.replace(/\s+/g, ' ').replace(/^(انا|اسمي|my name is|i am|i'm)\s+/i, '').slice(0, 60);
      if (name.replace(/[^\p{L}]/gu, '').length < 2) { await bot(L(CB.badName)); return; }
      cb.lead.name = name; cb.step = 'phone'; cbSave(); cbTexts(); await askFor('phone');
    } else if (step === 'phone') {
      const raw = toLatinDigits(t).replace(/[\s\-().]/g, '');
      const digits = raw.replace(/^\+|^00/, '').replace(/\D/g, '');
      if (!/^(\+|00)?\d+$/.test(raw) || digits.length < 8 || digits.length > 15) {
        if (looksLikeQuestion(t)) { cb.pendingQ = cb.pendingQ || t; cbSave(); await bot(L(CB.holdQ)); }
        await bot(L(CB.badPhone)); return;
      }
      cb.lead.phone = (/^(\+|00)/.test(raw) ? '+' : '') + digits; cb.step = 'biz'; cbSave(); cbTexts(); await askFor('biz');
    } else if (step === 'biz') {
      cb.lead.biz = chipKey === 'skip' ? '' : t.slice(0, 100); cb.step = 'city'; cbSave(); await askFor('city');
    } else if (step === 'city') {
      if (chipKey === 'city-other') { await bot(L(CB.typeCity)); return; }
      cb.lead.city = t.slice(0, 60); cb.step = 'svc'; cbSave(); await askFor('svc');
    } else if (step === 'svc') {
      cb.lead.svc = t.slice(0, 100); cbSave(); await finishLead(); return;
    } else if (step === 'done') {
      await answer(t, false, chipKey && chipKey.startsWith('q:') ? chipKey.slice(2) : '');
      await bot(L(CB.more));
    } else if (step === 'saving') { /* ignore while saving */ }
  } finally {
    cbBusy = false; cbChips(); cbTexts();
    const i = $cb('cbInput'); if (i && $cb('cbPanel') && !$cb('cbPanel').hidden && matchMedia('(pointer:fine)').matches) i.focus();
  }
}
function cbOpen(open) {
  const p = $cb('cbPanel'), l = $cb('cbLaunch'); if (!p) return;
  p.hidden = !open; l.setAttribute('aria-expanded', open ? 'true' : 'false');
  document.body.classList.toggle('cb-open', open);
  $cb('cbTeaser').hidden = true;
  if (open) { try { sessionStorage.setItem('pro-chat-teased', '1'); } catch (e) { /* ignore */ } cbStart(); setTimeout(() => $cb('cbInput').focus(), 60); }
  else l.focus();
}
function cbMount() {
  if (CONFIG.chatbot === false || $cb('cbPanel')) return;
  const w = document.createElement('div'); w.className = 'cb-root'; w.innerHTML = cbShell(); document.body.appendChild(w);
  cbTexts();
  $cb('cbLaunch').onclick = () => cbOpen($cb('cbPanel').hidden);
  $cb('cbClose').onclick = () => cbOpen(false);
  $cb('cbTeaserB').onclick = () => cbOpen(true);
  $cb('cbTeaserX').onclick = () => { $cb('cbTeaser').hidden = true; try { sessionStorage.setItem('pro-chat-teased', '1'); } catch (e) { /* ignore */ } };
  $cb('cbRestart').onclick = async () => { if (cbBusy) return; cb = cbFresh(); cbSave(); $cb('cbBody').innerHTML = ''; cbChips(); await cbStart(); };
  $cb('cbForm').onsubmit = e => { e.preventDefault(); const i = $cb('cbInput'); const v = i.value; i.value = ''; cbHandle(v); };
  $cb('cbChips').onclick = e => { const b = e.target.closest('.cb-chip'); if (!b) return; const k = b.dataset.k;
    cbHandle(b.textContent, k); };
  $cb('cbBody').addEventListener('click', e => { const a = e.target.closest('a.cb-lk'); if (a && matchMedia('(max-width:600px)').matches) cbOpen(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !$cb('cbPanel').hidden) cbOpen(false); });
  new MutationObserver(() => { cbTexts(); if (!$cb('cbPanel').hidden) cbChips(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  let teased = false; try { teased = sessionStorage.getItem('pro-chat-teased') === '1'; } catch (e) { teased = true; }
  if (!teased && !cb.msgs.length) setTimeout(() => { if ($cb('cbPanel').hidden) $cb('cbTeaser').hidden = false; }, 6000);
}
onIdle(cbMount, 2500);

/* =====================================================================
   FIRE CURSOR — replaces the mouse pointer with a glowing core + flame trail
   Desktop (fine pointer) only. Off for touch, reduced motion, or CONFIG.fireCursor === false.
   Text fields keep the normal text caret so typing stays easy.
   ===================================================================== */
onIdle(() => {
  if (CONFIG.fireCursor === false) return;
  const mq = q => window.matchMedia && matchMedia(q).matches;
  if (!mq('(pointer:fine)') || !mq('(hover:hover)') || mq('(prefers-reduced-motion: reduce)')) return;

  const cv = document.createElement('canvas');
  cv.className = 'fc-canvas'; cv.setAttribute('aria-hidden', 'true');
  const core = document.createElement('div');
  core.className = 'fc-core'; core.setAttribute('aria-hidden', 'true');
  document.body.append(cv, core);
  document.documentElement.classList.add('fire-cur');
  const ctx = cv.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); addEventListener('resize', size);

  const P = []; const MAX = 520;
  let x = -100, y = -100, px = -100, py = -100, seen = false, raf = 0, last = 0, hot = false, textMode = false;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function emit(n, cx, cy, vx, vy, burst) {
    for (let i = 0; i < n && P.length < MAX; i++) {
      const sp = burst ? rnd(1.5, 5.5) : rnd(0.2, 1.2), a = burst ? rnd(0, Math.PI * 2) : rnd(-Math.PI, 0);
      P.push({
        x: cx + rnd(-3, 3), y: cy + rnd(-3, 3),
        vx: Math.cos(a) * sp - vx * 0.06, vy: Math.sin(a) * sp - vy * 0.06 - (burst ? 0 : rnd(0.4, 1.3)),
        life: 0, max: burst ? rnd(28, 50) : rnd(30, 56), r: burst ? rnd(1.6, 3.4) : rnd(7, 15), spark: burst || Math.random() < 0.16
      });
    }
  }
  // white-hot → yellow → orange → deep red → smoke
  const fireColor = t => t < 0.15 ? [255, 250, 225] : t < 0.4 ? [255, 214, 0] : t < 0.7 ? [255, 128, 16] : [210, 40, 10];
  function tick(now) {
    raf = 0;
    const dt = Math.min(2.2, (now - (last || now)) / 16.67 || 1); last = now;
    const vx = x - px, vy = y - py, speed = Math.hypot(vx, vy);
    if (seen && !textMode) {
      // spread particles along the path so fast moves stay continuous
      const steps = Math.min(6, 1 + Math.floor(speed / 10));
      for (let s = 0; s < steps; s++) { const k = s / steps; emit(speed > 1 ? 3 : (Math.random() < 0.6 ? 1 : 0), px + vx * k, py + vy * k, vx, vy, false); }
    }
    px = x; py = y;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.life += dt; const t = p.life / p.max;
      if (t >= 1) { P.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy = p.vy * 0.97 - 0.035 * dt; p.x += Math.sin((p.life + i) * 0.35) * 0.35;
      const [r, g, b] = fireColor(t), a = (1 - t) * (1 - t * 0.3) * (p.spark ? 1 : 0.8);
      const rad = p.spark ? p.r * (1 - t * 0.6) : p.r * (0.6 + t * 0.9);
      if (p.spark) { ctx.fillStyle = `rgba(${r},${g},${b},${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 6.283); ctx.fill(); continue; }
      const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      gr.addColorStop(0, `rgba(${r},${g},${b},${a})`); gr.addColorStop(0.45, `rgba(${r},${Math.max(0, g - 60)},${b},${a * 0.45})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if ((P.length || speed > 0.5) && !document.hidden) raf = requestAnimationFrame(tick);
  }
  const wake = () => { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
  const isText = el => !!(el && el.closest && el.closest('input:not([type=button]):not([type=submit]):not([type=checkbox]):not([type=radio]):not([type=range]),textarea,select,[contenteditable="true"]'));
  const isHot = el => !!(el && el.closest && el.closest('a,button,[role=button],label,summary,.cb-chip,.chip,[data-k]'));

  addEventListener('pointermove', e => {
    if (e.pointerType && e.pointerType !== 'mouse') return;
    x = e.clientX; y = e.clientY;
    if (!seen) { seen = true; px = x; py = y; core.classList.add('on'); }
    core.style.transform = `translate3d(${x}px,${y}px,0)`;
    const el = e.target, tm = isText(el), h = !tm && isHot(el);
    if (tm !== textMode) { textMode = tm; core.classList.toggle('txt', tm); }
    if (h !== hot) { hot = h; core.classList.toggle('hot', h); }
    wake();
  }, { passive: true });
  addEventListener('pointerdown', e => {
    if (e.pointerType && e.pointerType !== 'mouse') return;
    core.classList.add('down'); if (!textMode) { emit(26, e.clientX, e.clientY, 0, 0, true); wake(); }
  }, { passive: true });
  addEventListener('pointerup', () => core.classList.remove('down'), { passive: true });
  document.addEventListener('pointerleave', () => { core.classList.remove('on'); seen = false; });
  document.documentElement.addEventListener('mouseleave', () => { core.classList.remove('on'); seen = false; });
  addEventListener('blur', () => { core.classList.remove('on'); seen = false; });
}, 3000);

/* ============================== BOOT ============================== */
addEventListener('hashchange', go);
render();
// Performance: hide the loader as soon as the first page is rendered (no waiting for every image/font to finish).
const ld = $('#loader'); if (ld) { const hide = () => ld.classList.add('done'); requestAnimationFrame(() => setTimeout(hide, 220)); setTimeout(hide, 1200); }
// Decorative fonts used only inside portfolio artboards: fetched after first paint, never render-blocking.
const BRAND_FONTS = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=El+Messiri:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Reem+Kufi:wght@500;700&family=Marcellus&family=Noto+Naskh+Arabic:wght@500;700&family=Saira+Condensed:wght@500;800&family=Changa:wght@500;700&family=Nunito:wght@600;800&family=Almarai:wght@400;800&family=Bebas+Neue&family=Lalezar&family=Barlow+Condensed:wght@500;700&family=Cairo:wght@600;800&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap';
const loadBrandFonts = () => { if (document.getElementById('brandFonts')) return; const l = document.createElement('link'); l.id = 'brandFonts'; l.rel = 'stylesheet'; l.href = BRAND_FONTS; l.media = 'print'; l.onload = () => { l.media = 'all'; }; document.head.appendChild(l); };
onIdle(loadBrandFonts);
}

</script>
