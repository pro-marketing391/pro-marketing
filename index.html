<style>
/*
VOICE   confident, premium, direct — speaks to Saudi decision-makers
IDEA    a lit stage at night: black void, one yellow key light on the subject
PICTURE a rotating faceted "growth crystal" in canvas with orbiting platform chips
COLOUR  #050505 ground, #FFD400 key light, white text, #A1A1AA support
TYPE    Readex Pro (display, AR+EN) + IBM Plex Sans Arabic (body)
LAYOUT  full-bleed bands, each section a different composition, 1240px content
*/
:root{color-scheme:dark;--bg:#050505;--bg2:#0c0c0c;--card:#101010;--line:rgba(255,255,255,.09);--ink:#fff;--mut:#A1A1AA;--y:#FFD400;--y2:#FFEA00;--glow:0 0 40px rgba(255,212,0,.35);--r:18px;--max:1240px;
--fd:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;--fb:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--fb);overflow-x:clip}
[lang=en] body{line-height:1.6}
img,svg,canvas{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--y);outline-offset:3px;border-radius:6px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--y);color:#000;padding:10px 16px;border-radius:10px;z-index:200;font-weight:700}
.skip:focus{top:12px}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:max(5vw,18px)}
.band{padding-block:clamp(64px,9vw,130px);position:relative}
.band.alt{background:var(--bg2)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--y);font-weight:600;font-size:14px;margin-bottom:18px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--y);box-shadow:var(--glow)}
.h1{font-size:clamp(38px,6.2vw,86px);line-height:1.05;letter-spacing:-.01em}
[lang=en] .h1{letter-spacing:-.03em}
.h2{font-size:clamp(30px,4.4vw,56px);line-height:1.1}
.h3{font-size:clamp(20px,2vw,24px)}
.lead{font-size:clamp(17px,1.5vw,20px);color:#d4d4d8;max-width:62ch}
.mut{color:var(--mut)}
.y{color:var(--y)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:end;margin-bottom:56px}
.sec-head .lead{justify-self:end}
@media(max-width:860px){.sec-head{grid-template-columns:1fr}.sec-head .lead{justify-self:start}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:600;font-family:var(--fd);font-size:16px;border:1px solid transparent;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn-y{background:var(--y);color:#000;box-shadow:0 10px 30px -10px rgba(255,212,0,.6)}
.btn-y:hover{background:var(--y2);transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(255,212,0,.75)}
.btn-o{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.03);backdrop-filter:blur(8px)}
.btn-o:hover{border-color:var(--y);color:var(--y)}
.btn-g{color:var(--ink);padding:0 6px;min-height:44px}
.btn-g:hover{color:var(--y)}
.btns{display:flex;flex-wrap:wrap;gap:12px}
[dir=rtl] .flip{transform:scaleX(-1)}

/* nav */
.nav{position:fixed;inset-inline:0;top:0;z-index:100;transition:background .3s,border-color .3s,backdrop-filter .3s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(5,5,5,.78);backdrop-filter:blur(16px) saturate(1.4);border-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:78px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.01em;flex:none}
.logo img{height:40px;width:auto}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--y);color:#000;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:var(--glow)}
.logo b{color:var(--y);font-weight:700}
.links{display:flex;gap:4px;margin-inline-start:auto}
.links a{padding:10px 14px;border-radius:999px;color:#d4d4d8;font-weight:500;transition:color .2s,background .2s}
.links a:hover,.links a[aria-current=page]{color:#fff;background:rgba(255,255,255,.06)}
.links a[aria-current=page]{color:var(--y)}
.nav-act{display:flex;gap:8px;align-items:center}
.lang{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600}
.lang:hover{border-color:var(--y);color:var(--y)}
.nav .btn{min-height:44px;padding:0 18px;font-size:15px}
.burger{display:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;place-items:center}
.burger span{display:block;width:20px;height:2px;background:#fff;margin:4px auto;transition:.3s}
.drawer{position:fixed;inset:0;z-index:99;background:rgba(5,5,5,.97);backdrop-filter:blur(10px);padding:100px max(6vw,20px) 40px;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto}
.drawer.open{opacity:1;pointer-events:auto}
.drawer a.big{font-family:var(--fd);font-size:30px;font-weight:600;padding:10px 0;border-bottom:1px solid var(--line)}
.drawer .subl{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:10px 0 16px;border-bottom:1px solid var(--line)}
.drawer .subl a{color:var(--mut);padding:6px 0;font-size:15px}
.drawer .btns{margin-top:24px}
@media(max-width:1020px){.links,.nav-act .btn-y{display:none}.burger{display:grid}.nav-act{margin-inline-start:auto}}
body.menu-open{overflow:hidden}
body.menu-open .burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* hero */
.hero{min-height:100svh;display:grid;align-items:center;position:relative;overflow:hidden;padding-top:90px;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(60% 55% at 70% 45%,rgba(255,212,0,.13),transparent 70%),radial-gradient(40% 40% at 15% 85%,rgba(255,212,0,.06),transparent 70%),#050505}
[dir=rtl] .hero-bg{transform:scaleX(-1)}
.grid-floor{position:absolute;inset-inline:-20%;bottom:-10%;height:55%;z-index:-1;background-image:linear-gradient(rgba(255,212,0,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,212,0,.16) 1px,transparent 1px);background-size:64px 64px;transform:perspective(600px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);animation:floor 6s linear infinite}
@keyframes floor{to{background-position:0 64px}}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:24px;align-items:center;width:100%}
.hero-copy{position:relative;z-index:2;padding-block:40px}
.hero-copy .lead{margin-top:26px}
.hero-copy .btns{margin-top:38px}
.hero h1 .ln{display:block;overflow:hidden}
.hero h1 .ln>span{display:inline-block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.hero h1 .ln:nth-child(2)>span{animation-delay:.12s}
.hero h1 .ln:nth-child(3)>span{animation-delay:.24s}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero h1 .hl{color:var(--y);text-shadow:0 0 40px rgba(255,212,0,.35)}
.stage{position:relative;aspect-ratio:1;width:100%;max-width:640px;justify-self:center}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.chip{position:absolute;width:clamp(52px,6vw,72px);aspect-ratio:1;border-radius:20px;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:clamp(15px,1.6vw,20px);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);box-shadow:0 20px 40px -12px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.25);transform-style:preserve-3d;animation:bob 6s ease-in-out infinite;will-change:transform}
.chip.yc{background:linear-gradient(145deg,#FFEA00,#d9a800);color:#000;border-color:rgba(255,255,255,.5)}
.chip i{position:absolute;inset:auto 10% -30% 10%;height:20%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(4px);font-style:normal}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -16px}}
.scroll-cue{position:absolute;bottom:26px;inset-inline-start:50%;translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mut);font-size:13px}
[dir=rtl] .scroll-cue{translate:50% 0}
.scroll-cue i{width:2px;height:40px;background:linear-gradient(var(--y),transparent);animation:cue 2s infinite}
@media(max-height:1000px){.scroll-cue{display:none}}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.stage{max-width:420px;order:-1;margin-top:10px;margin-bottom:-30px}.hero-copy{padding-top:0}.scroll-cue{display:none}}
@media(max-width:600px){.stage{max-width:320px}.hero-copy .btns .btn{flex:1 1 100%}}

/* marquee */
.marquee{border-block:1px solid var(--line);overflow:hidden;padding:22px 0;background:#000}
.marquee-in{display:flex;gap:56px;width:max-content;animation:mq 40s linear infinite}
[dir=rtl] .marquee-in{animation-name:mqr}
.marquee span{font-family:var(--fd);font-size:clamp(18px,2.2vw,26px);font-weight:600;color:#3f3f46;white-space:nowrap;display:flex;align-items:center;gap:56px}
.marquee span::after{content:"";width:10px;height:10px;background:var(--y);transform:rotate(45deg);box-shadow:var(--glow)}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes mqr{to{transform:translateX(50%)}}

/* services grid */
.svc-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.svc{grid-column:span 4;position:relative;border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:30px;min-height:300px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .3s,transform .4s;transform-style:preserve-3d}
.svc:nth-child(1),.svc:nth-child(2){grid-column:span 6;min-height:340px}
.svc:nth-child(6),.svc:nth-child(7){grid-column:span 6;min-height:260px}
.svc::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(255,212,0,.13),transparent 45%);opacity:0;transition:opacity .3s}
.svc:hover{border-color:rgba(255,212,0,.45)}
.svc:hover::before{opacity:1}
.svc .num{font-family:var(--fd);color:var(--y);font-weight:600;font-size:14px}
.svc h3{margin-top:auto;font-size:clamp(22px,2.2vw,30px);position:relative}
.svc p{color:var(--mut);margin-top:10px;max-width:52ch;position:relative}
.svc .go{position:absolute;top:26px;inset-inline-end:26px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.3s}
.svc:hover .go{background:var(--y);color:#000;border-color:var(--y);transform:rotate(-45deg)}
[dir=rtl] .svc:hover .go{transform:rotate(45deg)}
.svc .ico{position:absolute;inset-inline-end:-30px;bottom:-30px;width:200px;height:200px;opacity:.9;pointer-events:none}
@media(max-width:900px){.svc,.svc:nth-child(1),.svc:nth-child(2),.svc:nth-child(6),.svc:nth-child(7){grid-column:span 12;min-height:240px}}

/* sectors */
.sectors{display:flex;flex-wrap:wrap;gap:10px}
.sectors span{padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-weight:500}
.sectors span:nth-child(3n+1){border-color:rgba(255,212,0,.4);color:var(--y)}

/* why */
.why{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(32px,5vw,80px);align-items:start}
.why-sticky{position:sticky;top:110px}
.model{margin-top:28px;padding:24px;border-radius:var(--r);border:1px solid rgba(255,212,0,.3);background:linear-gradient(135deg,rgba(255,212,0,.09),transparent 60%)}
.route{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-family:var(--fd);font-weight:600}
.route i{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--y) 0 8px,transparent 8px 14px);animation:dash 1.2s linear infinite;font-style:normal}
[dir=rtl] .route i{animation-direction:reverse}
@keyframes dash{to{background-position:14px 0}}
.why-list{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.why-list div{background:var(--bg);padding:28px;transition:background .3s}
.why-list div:hover{background:#0d0d0d}
.why-list h3{font-size:19px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.why-list h3::before{content:"";width:8px;height:8px;flex:none;background:var(--y);transform:rotate(45deg)}
.why-list p{color:var(--mut);font-size:15px}
@media(max-width:900px){.why{grid-template-columns:1fr}.why-sticky{position:static}}
@media(max-width:600px){.why-list{grid-template-columns:1fr}}

/* process timeline */
.tl{position:relative;display:grid;gap:0;perspective:1200px}
.tl::before{content:"";position:absolute;inset-block:0;inset-inline-start:39px;width:2px;background:var(--line)}
.tl .bar{position:absolute;top:0;inset-inline-start:39px;width:2px;background:var(--y);box-shadow:var(--glow);height:var(--p,0%);transition:height .2s linear}
.step{display:grid;grid-template-columns:80px minmax(0,1fr);gap:24px;padding-block:22px;opacity:.25;transform:rotateX(18deg) translateY(30px);transform-origin:top;transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.step.in{opacity:1;transform:none}
.step .dot{width:80px;height:80px;border-radius:22px;display:grid;place-items:center;font-family:var(--fd);font-size:24px;font-weight:700;background:#0d0d0d;border:1px solid var(--line);position:relative;z-index:1;transition:.5s}
.step.in .dot{background:var(--y);color:#000;box-shadow:var(--glow),0 20px 30px -10px rgba(255,212,0,.4);border-color:var(--y)}
.step .card{padding:22px 26px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.04),transparent)}
.step h3{font-size:clamp(20px,2.2vw,28px);margin-bottom:6px}
.step p{color:var(--mut)}
@media(max-width:600px){.tl::before,.tl .bar{inset-inline-start:27px}.step{grid-template-columns:56px minmax(0,1fr);gap:14px}.step .dot{width:56px;height:56px;border-radius:16px;font-size:18px}.step .card{padding:18px}}

/* cta band */
.cta{position:relative;overflow:hidden;border-radius:28px;padding:clamp(40px,6vw,80px);background:var(--y);color:#000;display:grid;grid-template-columns:minmax(0,1.3fr) auto;gap:30px;align-items:center}
.cta .h2{color:#000}
.cta p{color:#262626;margin-top:14px;max-width:56ch;font-size:18px}
.cta .btn-y{background:#000;color:var(--y);box-shadow:none}
.cta .btn-y:hover{background:#151515}
.cta .btn-o{border-color:rgba(0,0,0,.3);color:#000}
.cta .btn-o:hover{border-color:#000;color:#000;background:rgba(0,0,0,.06)}
.cta::after{content:"";position:absolute;width:420px;height:420px;inset-inline-end:-120px;top:-160px;border:60px solid rgba(0,0,0,.07);border-radius:50%;pointer-events:none}
@media(max-width:860px){.cta{grid-template-columns:1fr}}

/* inner page hero */
.phero{padding-top:160px;padding-bottom:70px;position:relative;overflow:hidden;isolation:isolate}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 70% at 80% 30%,rgba(255,212,0,.12),transparent 70%)}
[dir=rtl] .phero::before{background:radial-gradient(50% 70% at 20% 30%,rgba(255,212,0,.12),transparent 70%)}
.phero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.phero .lead{margin-top:22px}
.phero .btns{margin-top:32px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;color:var(--mut);font-size:14px;margin-bottom:22px}
.crumbs a:hover{color:var(--y)}
.crumbs span[aria-hidden]{opacity:.5}
.vis{position:relative;aspect-ratio:1.1;width:100%;max-width:520px;justify-self:center;perspective:1000px}
@media(max-width:900px){.phero .wrap{grid-template-columns:1fr}.phero{padding-top:120px}.vis{max-width:380px}}

/* deliverables */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;counter-reset:d}
.dl li{list-style:none;counter-increment:d;padding:22px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-family:var(--fd);display:flex;gap:14px;align-items:flex-start;transition:border-color .3s,transform .3s}
.dl li:hover{border-color:rgba(255,212,0,.5);transform:translateY(-3px)}
.dl li::before{content:counter(d,decimal-leading-zero);color:var(--y);font-size:13px;padding-top:3px}
ul.dl{padding:0;margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,60px)}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.steps4{display:grid;gap:12px;counter-reset:s;padding:0;margin:0}
.steps4 li{list-style:none;counter-increment:s;display:flex;gap:18px;align-items:center;padding:18px 20px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.steps4 li::before{content:counter(s);width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--y);color:#000;font-weight:700;font-family:var(--fd)}
.gains{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0;margin:0}
.gains li{list-style:none;padding:22px;border-radius:14px;background:linear-gradient(160deg,rgba(255,212,0,.1),rgba(255,212,0,0) 70%);border:1px solid rgba(255,212,0,.18);font-weight:600}
.gains li svg{width:22px;height:22px;color:var(--y);margin-bottom:10px}
@media(max-width:520px){.gains{grid-template-columns:1fr}}
.blk-title{font-size:clamp(24px,2.6vw,34px);margin-bottom:24px}

/* platform tabs grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);min-height:200px;transition:.3s;position:relative;overflow:hidden}
.pcard:hover{border-color:var(--y);transform:translateY(-4px)}
.pcard .tag{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-weight:700;background:rgba(255,212,0,.12);color:var(--y);border:1px solid rgba(255,212,0,.35)}
.pcard h3{font-size:20px}
.pcard p{color:var(--mut);font-size:15px}
.pcard .more{margin-top:auto;color:var(--y);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.pcard .more svg{width:16px;height:16px}

/* platform page specifics */
.pp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pp>div{padding:26px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.pp h3{font-size:18px;margin-bottom:14px;color:var(--y)}
.pp ul{margin:0;padding:0;display:grid;gap:10px}
.pp li{list-style:none;display:flex;gap:10px}
.pp li::before{content:"";width:6px;height:6px;margin-top:11px;flex:none;background:var(--y);transform:rotate(45deg)}
.pp .wide{grid-column:span 3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.pp .wide ul{grid-template-columns:1fr 1fr}
@media(max-width:900px){.pp{grid-template-columns:1fr}.pp .wide{grid-column:auto;grid-template-columns:1fr}}
@media(max-width:520px){.pp .wide ul{grid-template-columns:1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills span{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:14px}
.sibs{display:flex;flex-wrap:wrap;gap:8px}
.sibs a{padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.sibs a:hover,.sibs a[aria-current=page]{border-color:var(--y);color:var(--y)}

/* faq */
.faq{display:grid;gap:10px}
.faq details{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.faq summary{cursor:pointer;list-style:none;padding:20px 22px;font-weight:600;font-family:var(--fd);display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;color:var(--y);transition:transform .3s;flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 22px 20px;color:var(--mut)}

/* portfolio */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
.filters button{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500}
.filters button[aria-pressed=true]{background:var(--y);color:#000;border-color:var(--y);font-weight:700}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.work{border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .4s,border-color .3s}
.work:hover{transform:translateY(-6px);border-color:rgba(255,212,0,.5)}
.work .thumb{aspect-ratio:16/10;position:relative;overflow:hidden;background:#0a0a0a}
.work .thumb svg{width:100%;height:100%;transition:transform .8s}
.work:hover .thumb svg{transform:scale(1.07)}
.work .ph{position:absolute;top:12px;inset-inline-start:12px;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.7);border:1px dashed rgba(255,212,0,.6);color:var(--y);font-size:12px;font-weight:600}
.work .body{padding:22px;display:flex;flex-direction:column;gap:8px;flex:1}
.work .cat{color:var(--y);font-size:13px;font-weight:600}
.work h3{font-size:20px}
.work p{color:var(--mut);font-size:15px}
.work .more{margin-top:auto;padding-top:10px;font-weight:600;display:flex;gap:8px;align-items:center}
.work .more svg{width:16px;height:16px}
.work[hidden]{display:none}
.case-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.case-grid>div{padding:28px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.case-grid h3{color:var(--y);font-size:18px;margin-bottom:10px}
.pending{border:1px dashed rgba(255,212,0,.5)!important;background:repeating-linear-gradient(135deg,rgba(255,212,0,.04) 0 12px,transparent 12px 24px)!important}
@media(max-width:860px){.case-grid{grid-template-columns:1fr}}

/* about */
.about-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.about-grid>div{padding:30px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.about-grid h3{font-size:22px;margin-bottom:10px}
.about-grid p{color:var(--mut)}
.values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.values div{background:var(--bg);padding:40px 20px;text-align:center;font-family:var(--fd);font-size:clamp(20px,2.4vw,30px);font-weight:700}
.values div:nth-child(odd){color:var(--y)}
@media(max-width:700px){.about-grid{grid-template-columns:1fr}.values{grid-template-columns:1fr 1fr}}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:24px;align-items:start}
@media(max-width:960px){.contact{grid-template-columns:1fr}}
form.lead-form{padding:clamp(22px,3vw,40px);border-radius:24px;background:var(--card);border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.fld{display:grid;gap:8px}
.fld.full{grid-column:1/-1}
.fld label,.fld legend{font-weight:600;font-size:15px}
.fld label .rq,.fld legend .rq{color:var(--y)}
.inp{width:100%;min-height:52px;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#080808;font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 3px rgba(255,212,0,.2)}
textarea.inp{min-height:130px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#A1A1AA 50%),linear-gradient(135deg,#A1A1AA 50%,transparent 50%);background-position:calc(100% - 22px) 23px,calc(100% - 16px) 23px;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:40px}
[dir=rtl] select.inp{background-position:22px 23px,16px 23px}
.phone{display:flex;direction:ltr}
.phone select{width:auto;flex:none;border-start-end-radius:0;border-end-end-radius:0;border-inline-end:0;padding-inline-end:34px;background-position:calc(100% - 18px) 23px,calc(100% - 12px) 23px!important}
.phone input{border-start-start-radius:0;border-end-start-radius:0}
fieldset.fld{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);cursor:pointer;font-weight:500;font-size:15px;transition:.2s}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks label:has(input:checked){background:var(--y);border-color:var(--y);color:#000;font-weight:700}
.checks label:has(input:focus-visible){outline:2px solid var(--y);outline-offset:2px}
.err{color:#ff8a8a;font-size:13px;min-height:0}
.fld.bad .inp,.fld.bad .checks label{border-color:#ff6b6b}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.form-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.form-foot small{color:var(--mut)}
.status{grid-column:1/-1;padding:16px 18px;border-radius:12px;font-weight:600;display:none}
.status.ok{display:block;background:rgba(255,212,0,.12);border:1px solid var(--y);color:var(--y)}
.status.no{display:block;background:rgba(255,80,80,.1);border:1px solid #ff6b6b;color:#ffb3b3}
.btn[disabled]{opacity:.6;pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#000;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){form.lead-form{grid-template-columns:1fr}}
.side{display:grid;gap:12px;position:sticky;top:100px}
.side a,.side .box{display:flex;gap:14px;align-items:center;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--card);transition:.3s}
.side a:hover{border-color:var(--y)}
.side .ic{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;background:rgba(255,212,0,.12);color:var(--y)}
.side .ic svg{width:22px;height:22px}
.side b{display:block;font-family:var(--fd)}
.side small{color:var(--mut);direction:ltr;unicode-bidi:isolate}
@media(max-width:960px){.side{position:static}}

/* footer */
footer{border-top:1px solid var(--line);padding-block:70px 30px;background:#000;margin-top:0}
.foot{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:32px}
.foot h4{font-size:15px;color:var(--y);margin-bottom:14px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.foot a{color:var(--mut);display:inline-block;padding:4px 0}
.foot a:hover{color:#fff}
.foot p{color:var(--mut);margin-top:14px;max-width:40ch}
.copy{margin-top:50px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:#71717a;font-size:14px}
@media(max-width:860px){.foot{grid-template-columns:1fr 1fr}.foot>div:first-child{grid-column:1/-1}}

/* whatsapp fab */
.fab{position:fixed;bottom:22px;inset-inline-end:22px;z-index:90;width:60px;height:60px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;box-shadow:0 14px 34px -8px rgba(255,212,0,.6);transition:transform .3s}
.fab:hover{transform:scale(1.08)}
.fab svg{width:28px;height:28px}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--y);animation:ping 2.4s infinite}
@keyframes ping{to{transform:scale(1.6);opacity:0}}
.fab .tip{position:absolute;inset-inline-end:72px;white-space:nowrap;background:#111;color:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
.fab:hover .tip{opacity:1}

/* loader */
.loader{position:fixed;inset:0;z-index:300;background:#050505;display:grid;place-items:center;transition:opacity .6s,visibility .6s}
.loader.done{opacity:0;visibility:hidden}
.loader .lm{display:flex;flex-direction:column;align-items:center;gap:22px}
.loader .logo{font-size:26px}
.loader .lbar{width:160px;height:2px;background:var(--line);overflow:hidden;border-radius:2px}
.loader .lbar i{display:block;height:100%;width:40%;background:var(--y);box-shadow:var(--glow);animation:lb 1s ease-in-out infinite}
@keyframes lb{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
[dir=rtl] .loader .lbar i{animation-name:lbr}
@keyframes lbr{from{transform:translateX(100%)}to{transform:translateX(-250%)}}

/* reveal + transitions */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
main{animation:pagein .6s cubic-bezier(.2,.8,.2,1)}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.curtain{position:fixed;inset:0;z-index:150;background:var(--y);transform:scaleY(0);transform-origin:bottom;pointer-events:none}
.curtain.go{animation:curt .7s cubic-bezier(.7,0,.3,1)}
@keyframes curt{0%{transform:scaleY(0);transform-origin:bottom}45%{transform:scaleY(1);transform-origin:bottom}55%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(0);transform-origin:top}}
.spot{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(closest-side,rgba(255,212,0,.07),transparent);translate:-50% -50%;left:0;top:0;transition:opacity .4s}
@media(hover:none){.spot{display:none}}

/* service visuals (CSS 3D) */
.v3d{position:absolute;inset:0;transform-style:preserve-3d;animation:tilt 10s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotateY(-14deg) rotateX(8deg)}50%{transform:rotateY(14deg) rotateX(-4deg)}}
.glass{position:absolute;border-radius:20px;background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);box-shadow:0 30px 60px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.ysolid{background:linear-gradient(150deg,#FFEA00,#c99a00);border-color:rgba(255,255,255,.4)}
.vline{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin:8px 0}
.vline.y{background:var(--y)}
.halo{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,212,0,.35),transparent);filter:blur(30px)}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(255,212,0,.35)}
.spinr{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flt{animation:bob 5s ease-in-out infinite}
.flt2{animation:bob 6.5s ease-in-out infinite reverse}
.barv{position:absolute;bottom:18%;width:11%;border-radius:8px 8px 3px 3px;background:linear-gradient(#FFEA00,#b38700);box-shadow:0 0 24px rgba(255,212,0,.35);transform-origin:bottom;animation:grow 2.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.rv,.step{opacity:1;transform:none}}

/* ==================== v2 COMPONENTS ==================== */
.sm{font-size:13px}
@media(max-width:1180px){.links,.nav-act .btn-y{display:none}.burger{display:grid}.nav-act{margin-inline-start:auto}}
.links a{padding:10px 12px}
.svc-h1{font-size:clamp(32px,4.6vw,64px)}
/* word reveal */
.sw .w{display:inline-block;opacity:0;transform:translateY(.45em) rotateX(-50deg);transform-origin:bottom;transition:opacity .7s cubic-bezier(.2,.8,.2,1) calc(var(--i)*55ms),transform .8s cubic-bezier(.2,.8,.2,1) calc(var(--i)*55ms)}
.sw.in .w{opacity:1;transform:none}
/* problems / who */
.pw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,4vw,64px)}
@media(max-width:860px){.pw{grid-template-columns:1fr}}
.probs{list-style:none;margin:0;padding:0;counter-reset:p;border-top:1px solid var(--line)}
.probs li{counter-increment:p;display:flex;gap:18px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);font-size:clamp(17px,1.6vw,21px);font-family:var(--fd);font-weight:500}
.probs li::before{content:"✕";color:#ff7a7a;font-size:14px;flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,122,122,.4);display:grid;place-items:center;transform:translateY(4px)}
.who{padding:30px;border-radius:24px;background:linear-gradient(160deg,rgba(255,212,0,.12),rgba(255,212,0,.02));border:1px solid rgba(255,212,0,.25)}
.who ul,.recv ul,.chk{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.who li,.recv li,.chk li{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.who svg,.recv svg,.chk svg{width:20px;height:20px;color:var(--y);flex:none;margin-top:4px}
/* included */
.inc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.inc li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 18px;padding:26px 0;border-top:1px solid var(--line);transition:background .3s}
.inc li:hover .in-n{color:var(--y);-webkit-text-stroke:0}
.in-n{grid-row:span 2;font:700 44px/1 var(--fd);color:transparent;-webkit-text-stroke:1px rgba(255,212,0,.6);transition:.3s}
.inc h3{font-size:20px}.inc p{color:var(--mut)}
@media(max-width:800px){.inc{grid-template-columns:1fr}}
.recv{padding:34px;border-radius:24px;background:var(--y);color:#000}
.recv .blk-title{color:#000}.recv svg{color:#000}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}}@media(max-width:520px){.g4{grid-template-columns:1fr}}
/* costs */
.costs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;perspective:1200px}
.cost{position:relative;padding:34px 28px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,#121212,#0a0a0a);overflow:hidden;transition:transform .5s}
.cost:hover{transform:translateY(-6px) rotateX(4deg)}
.cost.c1{border-color:var(--y);box-shadow:0 0 0 1px var(--y),0 30px 60px -30px rgba(255,212,0,.4)}
.cn{position:absolute;inset-inline-end:18px;top:6px;font:800 90px/1 var(--fd);color:rgba(255,255,255,.05)}
.cost h3{font-size:22px;margin-bottom:12px}.cost.c1 h3{color:var(--y)}.cost p{color:#d4d4d8}
@media(max-width:860px){.costs{grid-template-columns:1fr}}
.notice{margin-top:24px;padding:22px 26px;border-radius:16px;border:1px dashed rgba(255,212,0,.55);background:repeating-linear-gradient(135deg,rgba(255,212,0,.05) 0 12px,transparent 12px 24px)}
.notice b{color:var(--y);display:block;margin-bottom:6px;font-family:var(--fd)}
.notice p{color:#d4d4d8}
/* platform v2 */
.does{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0;background:var(--bg);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.does>div{background:var(--bg);padding:28px;transition:background .3s;box-shadow:0 0 0 .5px var(--line)}
.does>div:hover{background:#0e0e0e}
.dn{font:700 13px var(--fd);color:var(--y);display:block;margin-bottom:14px}
.does h3{font-size:19px;margin-bottom:8px}.does p{color:var(--mut);font-size:15px}
.pp3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.whyq{grid-column:1/-1;margin:0;padding:clamp(28px,4vw,48px);border-radius:24px;font:600 clamp(20px,2.4vw,30px)/1.45 var(--fd);background:radial-gradient(80% 120% at 100% 0%,rgba(255,212,0,.18),transparent 60%),#0d0d0d;border:1px solid rgba(255,212,0,.25)}
.whyq small{display:block;color:var(--y);font-size:14px;margin-bottom:12px}
.pbox{padding:28px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
.pbox h3{font-size:18px;color:var(--y);margin-bottom:16px}
.meters{display:grid;gap:14px;margin-bottom:12px}
.meters div{display:grid;gap:6px}
.meters i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.meters i::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);background:linear-gradient(90deg,#b38700,var(--y));border-radius:3px;animation:grow2 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow2{from{width:0}}
@media(max-width:760px){.pp3{grid-template-columns:1fr}}
/* compare table */
.cmp{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:560px}
.cmp th,.cmp td{padding:18px 20px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
.cmp thead th{font-family:var(--fd);background:#0d0d0d}
.cmp thead th:last-child{background:var(--y);color:#000}
.cmp tbody th{font-family:var(--fd);color:var(--y);width:18%}

/* ==================== v7 DESIGN POLISH ==================== */
/* Typography system — Alexandria (Arabic) + Plus Jakarta Sans (English) */
:root{--mut:#B8B8B8;--t-h1:clamp(38px,5.8vw,84px);--t-h2:clamp(28px,3.8vw,52px);--t-h3:clamp(19px,1.7vw,23px);--t-lead:clamp(17px,1.35vw,19px);--t-body:16px;--t-sm:14px}
:root[lang=ar]{--fd:'Alexandria','Plus Jakarta Sans',system-ui,sans-serif;--fb:'Alexandria','Plus Jakarta Sans',system-ui,sans-serif}
:root[lang=en]{--fd:'Plus Jakarta Sans','Alexandria',system-ui,sans-serif;--fb:'Plus Jakarta Sans','Alexandria',system-ui,sans-serif}
body{font-family:var(--fb);font-size:var(--t-body);font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[lang=ar] body{line-height:1.85}[lang=en] body{line-height:1.65}
h1,h2,h3,h4{font-family:var(--fd)}
.h1{font-size:var(--t-h1);font-weight:800}.h2{font-size:var(--t-h2);font-weight:800}.h3{font-size:var(--t-h3);font-weight:700}
[lang=ar] .h1{line-height:1.28;letter-spacing:0}[lang=ar] .h2{line-height:1.32;letter-spacing:0}[lang=ar] h3,[lang=ar] h4{line-height:1.5;letter-spacing:0}
[lang=en] .h1{line-height:1.04;letter-spacing:-.035em}[lang=en] .h2{line-height:1.1;letter-spacing:-.025em}[lang=en] h3{letter-spacing:-.01em}
.lead{font-size:var(--t-lead);color:#d6d6d6;line-height:1.8}
[lang=en] .lead{line-height:1.65}
.mut{color:var(--mut)}
.eyebrow{font-size:var(--t-sm);font-weight:600;letter-spacing:0}
[lang=en] .eyebrow{letter-spacing:.02em}
.hero .h1{font-size:clamp(40px,5.6vw,82px);font-weight:900}
[lang=ar] .hero .h1{line-height:1.3}
.hero h1 .ln{padding-block:.04em .14em;margin-block:-.04em -.14em}
.svc-h1{font-size:clamp(30px,4.2vw,58px)!important;font-weight:800}
.phero .h1{font-weight:800}
/* Premium text shadow */
.hero h1{text-shadow:0 1px 0 rgba(0,0,0,.65),0 6px 14px rgba(0,0,0,.55),0 18px 42px rgba(0,0,0,.45)}
.hero h1 .hl,.cta-hl{text-shadow:0 0 16px rgba(255,212,0,.32),0 0 44px rgba(255,212,0,.16),0 6px 18px rgba(0,0,0,.45)}
.h2,.phero .h1{text-shadow:0 2px 0 rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.5)}
.cta .h2,.recv .blk-title{text-shadow:none}
.svc h3,.pcard h3,.gtool h3,.itile h3,.work h3{transition:text-shadow .35s,color .35s}
.svc:hover h3,.pcard:hover h3,.gtool:hover h3,.itile:hover h3,.work:hover h3{text-shadow:0 6px 18px rgba(0,0,0,.65),0 0 22px rgba(255,212,0,.22)}
/* Buttons — one system */
.btn{border-radius:999px;min-height:52px;padding:0 26px;font-weight:700;font-size:15.5px;letter-spacing:0;line-height:1.2;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s,border-color .25s,color .25s}
.btn:active{transform:translateY(0) scale(.97)}
.btn:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn-y{box-shadow:0 10px 26px -10px rgba(255,212,0,.65),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn-y:hover{box-shadow:0 16px 36px -12px rgba(255,212,0,.8),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn-o{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn-o:hover{transform:translateY(-2px)}
.btn-g{min-height:48px;padding:0 10px;border-radius:12px}
.btn-g:hover{background:rgba(255,255,255,.05)}
.nav .btn{min-height:46px;padding:0 20px;font-size:14.5px}
.lang{transition:border-color .25s,color .25s}.lang:focus-visible{outline:3px solid var(--y);outline-offset:3px}
/* Cards — depth & soft shadows */
.svc,.pcard,.gtool,.itile,.work,.cost,.pbox,.does,.inc li,.faq details,.about-grid>div,.cs-steps li,.jcard,.wt-panel,.xp-steps fieldset{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 48px -30px rgba(0,0,0,.9)}
.svc:hover,.pcard:hover,.gtool:hover,.itile:hover,.work:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 60px -28px rgba(0,0,0,.95),0 0 0 1px rgba(255,212,0,.25)}
.svc{grid-column:span 4!important;min-height:290px}
@media(max-width:1000px){.svc{grid-column:span 6!important}}
@media(max-width:640px){.svc{grid-column:span 12!important;min-height:230px}}
.svc p,.pcard p,.gtool p,.itile p,.work p{color:var(--mut)}
.faq summary{font-weight:600}
.model,.who,.whyq,.xp-out{backdrop-filter:blur(10px)}
/* Hero balance: rocket stays a feature, not the headline */
.stage.rk{max-width:620px}
@media(min-width:901px){.hero .wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
/* Forms */
.inp{font-family:var(--fb)}.fld label,.fld legend{font-weight:600}
/* Arabic: never letter-space, keep numbers/phones LTR */
[lang=ar] .lg-s:not(.lg-ar),[lang=ar] .wm{direction:ltr}
[dir=rtl] .wa-num,[dir=rtl] [dir=ltr]{unicode-bidi:isolate}
.svc .ico{width:128px;height:128px;inset-inline-end:-18px;bottom:-18px;opacity:.38;transition:opacity .35s,transform .45s}
.svc:hover .ico{opacity:.6;transform:scale(1.06)}
.svc h3,.svc p{z-index:1}
.svc p{max-width:34ch}

.ft-soc-h{margin-top:26px;font:700 13px var(--fd);color:var(--y)}

.fs{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 24px -14px #000;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s,background .3s}
.fs .bi.fsi{--s:38px;border:0;background:none;box-shadow:none}

.fs-tip{position:absolute;bottom:calc(100% + 10px);left:50%;translate:-50% 4px;white-space:nowrap;padding:5px 10px;border-radius:8px;background:#111;border:1px solid var(--line);font-size:12px;font-weight:600;color:#fff;opacity:0;pointer-events:none;transition:.25s}

.ft-quote{margin-top:16px;min-height:46px;font-size:14px}

.st-tile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--neon);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s}
.st-tile:hover,.st-tile:focus-visible{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(139,92,255,.9)}
.st-tile:hover::before,.st-tile:focus-visible::before{opacity:1}
.st-ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#c8b9ff;background:rgba(139,92,255,.14);border:1px solid rgba(139,92,255,.35)}
.st-ti svg{width:21px;height:21px}
.st-tn{position:absolute;top:16px;inset-inline-end:16px;font:800 12px/1 inherit;color:rgba(255,255,255,.3)}
.st-tile b{font-size:15.5px;color:#fff;line-height:1.5}.st-tile small{font-size:12px;color:#8f93b8}
/* motion showcase */
.st-motion{position:relative;height:440px;border-radius:28px;background:radial-gradient(70% 60% at 50% 40%,rgba(139,92,255,.25),transparent 70%),#07070d;border:1px solid rgba(139,92,255,.3);overflow:hidden;perspective:900px;display:grid;place-items:center}
.st-3dtype{display:flex;gap:2px;transform-style:preserve-3d;animation:stType 9s ease-in-out infinite;direction:ltr}
.st-3dtype span{font:900 clamp(46px,6vw,84px)/1 "Anton",Impact,sans-serif;color:#fff;letter-spacing:.02em;
  text-shadow:1px 1px 0 #6d4fd8,2px 2px 0 #5c40c4,3px 3px 0 #4b33ad,4px 4px 0 #3b2794,5px 5px 0 #2c1d7a,6px 6px 0 #1e1460,0 0 30px rgba(139,92,255,.9),8px 14px 30px rgba(0,0,0,.6);
  animation:stLetter 3.2s ease-in-out infinite;animation-delay:calc(var(--d)*.12s);display:inline-block}
.st-3dtype span:nth-child(3),.st-3dtype span:nth-child(4){color:#FFD400;text-shadow:1px 1px 0 #d9b200,2px 2px 0 #b89600,3px 3px 0 #967a00,4px 4px 0 #765f00,5px 5px 0 #574500,0 0 30px rgba(255,212,0,.8),8px 14px 30px rgba(0,0,0,.6)}
@keyframes stType{0%,100%{transform:rotateX(14deg) rotateY(-22deg)}50%{transform:rotateX(-8deg) rotateY(22deg)}}
@keyframes stLetter{0%,100%{transform:translateZ(0) translateY(0)}50%{transform:translateZ(40px) translateY(-10px)}}
.st-logo3d{position:absolute;top:30px;inset-inline-end:34px;width:120px;height:120px;transform-style:preserve-3d;animation:stLogo 8s linear infinite}
.st-logo3d img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(255,212,0,.6))}
.st-logo3d i{position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(139,92,255,.7);transform:rotateX(70deg);box-shadow:0 0 14px rgba(139,92,255,.7)}
.st-logo3d i:nth-child(3){transform:rotateY(70deg);border-color:rgba(46,139,255,.7)}.st-logo3d i:nth-child(4){transform:rotateX(70deg) rotateY(60deg);border-color:rgba(255,212,0,.6)}
@keyframes stLogo{to{transform:rotateY(360deg)}}
/* voice studio */
.st-voices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.st-voice{padding:20px;border-radius:20px;background:linear-gradient(160deg,rgba(139,92,255,.12),rgba(46,139,255,.05));border:1px solid rgba(160,140,255,.25);display:grid;gap:10px;transition:border-color .3s,box-shadow .3s}
.st-voice.playing{border-color:#a78bff;box-shadow:0 0 40px -10px rgba(139,92,255,.9)}
.st-voice.off{opacity:.78}
.st-vh{display:flex;align-items:center;gap:10px}.st-vh b{color:#fff;font-size:15.5px}
.st-vt{font:800 10px/1 inherit;letter-spacing:.06em;padding:5px 8px;border-radius:8px;background:rgba(255,212,0,.12);color:#FFD400;border:1px solid rgba(255,212,0,.35)}
.st-voice p{color:#a9acc8;font-size:13.5px;margin:0;line-height:1.7}
.st-vp{display:flex;align-items:center;gap:12px}
.st-vbtn{flex:0 0 46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#000;background:linear-gradient(135deg,#FFE14D,#FFD400);box-shadow:0 10px 24px -8px rgba(255,212,0,.7);transition:transform .25s}
.st-vbtn svg{width:20px;height:20px}.st-vbtn:hover:not(:disabled){transform:scale(1.07)}
.st-vbtn:disabled{cursor:not-allowed;background:#24242e;color:#666;box-shadow:none}
.st-vwave{flex:1;min-width:0;width:100%;height:44px;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(160,140,255,.22) 0 3px,transparent 3px 8px) center/100% 30% no-repeat}
.st-voice.playing .st-vwave{background:none}
.st-soon{color:#8f93b8;font-size:12px}
.st-note{margin-top:22px;color:#9aa0c3;font-size:14px}.st-note a{color:#b9a6ff;text-decoration:underline}
/* sound EQ */
.st-eq{height:300px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:6px;background:radial-gradient(60% 60% at 50% 50%,rgba(46,139,255,.22),transparent 70%),#07070d;border:1px solid rgba(46,139,255,.3);padding:20px}
.st-eq i{width:8px;border-radius:6px;height:20%;background:linear-gradient(#22D3EE,#8B5CFF 60%,#FFD400);box-shadow:0 0 14px rgba(139,92,255,.6);animation:stEq 1.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.13s)}
@keyframes stEq{0%,100%{height:14%}25%{height:72%}50%{height:34%}75%{height:88%}}
/* showreel */
.st-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.st-f{font:700 14px/1 inherit;color:#cfd2ea;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.25s}
.st-f:hover,.st-f:focus-visible{border-color:#a78bff;color:#fff}
.st-f.on{background:var(--neon);border-color:transparent;color:#fff;box-shadow:0 0 26px -6px rgba(139,92,255,.9)}
.st-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.st-card{border-radius:22px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.1);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,border-color .4s}
.st-card:hover{transform:translateY(-6px) rotateX(2deg);border-color:rgba(160,140,255,.5);box-shadow:0 30px 60px -30px rgba(139,92,255,.9)}
.st-card[hidden],.st-slot[hidden]{display:none}
.st-thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;cursor:pointer;background:#05050a;overflow:hidden}
.st-play{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;display:grid;place-items:center;color:#000;background:rgba(255,212,0,.95);box-shadow:0 0 0 10px rgba(255,212,0,.18),0 18px 40px -10px #000;transition:transform .3s,opacity .3s}
.st-play svg{width:28px;height:28px;margin-inline-start:4px}
[dir=rtl] .st-play svg{margin-inline-start:0;margin-inline-end:4px;transform:none}
.st-thumb:hover .st-play,.st-thumb:focus-visible .st-play{transform:scale(1.1)}
.st-dur{position:absolute;bottom:10px;inset-inline-end:10px;font:700 12px/1 inherit;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff}
.st-cb{padding:18px 20px 22px;display:grid;gap:8px}
.st-cats{display:flex;gap:6px;flex-wrap:wrap}.st-cats span{font:700 11px/1 inherit;padding:6px 9px;border-radius:999px;color:#c8b9ff;background:rgba(139,92,255,.14);border:1px solid rgba(139,92,255,.3)}
.st-cb h3{color:#fff;font-size:19px}.st-cb p{color:#a9acc8;font-size:14px;line-height:1.75;margin:0}
.st-slot{grid-column:1/-1;display:grid;justify-items:center;text-align:center;gap:10px;padding:50px 20px;border-radius:22px;border:1px dashed rgba(160,140,255,.45);background:rgba(139,92,255,.05)}
.st-slot b{color:#fff;font-size:18px}.st-slot p{color:#a9acc8;max-width:460px}
/* lightbox */
.st-lb{width:min(1100px,94vw);max-height:94vh;padding:0;border:1px solid rgba(160,140,255,.4);border-radius:24px;background:#07070d;color:#fff;box-shadow:0 0 80px -10px rgba(139,92,255,.6)}
.st-lb::backdrop{background:rgba(3,3,8,.82);backdrop-filter:blur(8px)}
.st-lb-in{position:relative;display:grid}
.st-lb-v video{width:100%;max-height:70vh;display:block;background:#000}
.st-lb-meta{padding:20px 24px 24px;display:grid;gap:10px}.st-lb-meta .st-tag{position:static;justify-self:start}
.st-lb-meta h3{font-size:22px}.st-lb-meta p{color:#b3b6d4;line-height:1.8;margin:0}
.st-lb-x{position:absolute;top:12px;inset-inline-end:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.st-lb-x svg{width:20px;height:20px}.st-lb-x:hover{border-color:#FFD400;color:#FFD400}
/* CTA */
.st-cta{position:relative;overflow:hidden;border-radius:32px;padding:clamp(40px,6vw,80px);text-align:center;display:grid;justify-items:center;gap:16px;border:1px solid rgba(160,140,255,.4);background:#07070d}
.st-cta-bg{position:absolute;inset:0;z-index:0;background:conic-gradient(from 0deg at 50% 50%,rgba(139,92,255,.35),rgba(46,139,255,.25),rgba(255,212,0,.18),rgba(139,92,255,.35));filter:blur(60px);animation:stSpinBg 14s linear infinite}
@keyframes stSpinBg{to{transform:rotate(360deg)}}
.st-cta>*:not(.st-cta-bg){position:relative;z-index:1}
.st-cta-t{font-size:clamp(28px,4vw,54px);line-height:1.2;font-weight:800;color:#fff;text-shadow:0 0 34px rgba(139,92,255,.8)}
.st-cta p{color:#d6d8ef;max-width:620px}
.st-cta .btns{justify-content:center}
/* form */
.st-fwrap{align-items:start}
.st-checks{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.st-checks li{display:flex;gap:10px;align-items:center;color:#d6d8ef}.st-checks svg{width:20px;height:20px;color:#FFD400;flex:0 0 auto}
.st-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:28px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(160,140,255,.3);backdrop-filter:blur(14px);box-shadow:0 30px 80px -40px rgba(139,92,255,.9)}
.st-form .full{grid-column:1/-1}
.st-form .lbl{display:block;font-weight:600;margin-bottom:8px;font-size:14px}
.st-phone{display:flex;gap:8px;direction:ltr}.st-phone select{flex:0 0 112px}.st-phone input{flex:1;min-width:0}
.st-drop{display:grid;justify-items:center;gap:6px;text-align:center;padding:24px 16px;border-radius:16px;border:1.5px dashed rgba(160,140,255,.5);background:rgba(139,92,255,.06);cursor:pointer;transition:.25s;color:#d6d8ef}
.st-drop svg{width:28px;height:28px;color:#b9a6ff}.st-drop small{color:#8f93b8;font-size:12px}
.st-drop:hover,.st-drop.over,#st-file:focus-visible+.err,.st-drop:focus-within{border-color:#FFD400;background:rgba(255,212,0,.06)}
.st-drop.has{border-style:solid;border-color:rgba(255,212,0,.6)}
.st-rm{margin-inline-start:8px;font:700 12px inherit;color:#ff8a8a;background:none;border:1px solid rgba(255,138,138,.4);border-radius:999px;padding:4px 10px;cursor:pointer}
.st-submit{display:grid;gap:10px}
.st-home{padding:clamp(70px,9vw,120px) 0}
@media(max-width:1020px){.st-voices{grid-template-columns:repeat(2,minmax(0,1fr))}.st-two{grid-template-columns:1fr}.st-motion{height:340px}}
@media(max-width:900px){.st-hero-in{grid-template-columns:1fr}.st-hero{padding-top:110px}.st-car{order:-1}}
@media(max-width:600px){.st-grid{grid-template-columns:1fr}.st-voices{grid-template-columns:1fr}.st-form{grid-template-columns:1fr;padding:20px}.sth{gap:14px}.st-num{width:54px;height:54px;font-size:20px;border-radius:16px}
  .st-car{--r:118px;height:250px}.st-car.sm{--r:110px;height:230px}.st-tiles{grid-template-columns:1fr 1fr}.st-tile{padding:16px 14px}.st-tile b{font-size:14px}.st-eq{height:200px}.st-motion{height:280px}.st-logo3d{width:80px;height:80px}}
@media(prefers-reduced-motion:reduce){.st-particles,.st-orb,.st-cube,.st-pyr,.st-3dtype,.st-3dtype span,.st-logo3d,.st-eq i,.st-cta-bg,.st-marq>div,.st-glow{animation:none!important}}

.st-car .st-tag{font-size:9.5px;padding:5px 7px;top:7px;inset-inline-start:7px}
@media(max-width:600px){.st-car .st-tag{font-size:8px;padding:3px 6px}}

/* ==================== v18 PERFORMANCE ==================== */
/* glass tiles: the blur behind them was invisible on the dark background but cost a repaint on every scroll frame */
.st-tile{backdrop-filter:none;-webkit-backdrop-filter:none}
.st-cta-bg{will-change:transform}
.st-car .st-ring{will-change:transform}
@media(max-width:700px){
  /* phones: keep the look, drop the continuous effects that cost the most frames */
  .st-glow{animation:none;filter:drop-shadow(0 0 14px rgba(139,92,255,.45))}
  .st-particles,.st-pyr{display:none}
  .st-orb,.st-cube,.st-cta-bg,.st-3dtype,.st-3dtype span,.st-logo3d,.st-eq i{animation:none}
  .st-cta-bg{filter:blur(40px)}
  .st-screen{box-shadow:0 18px 36px -16px #000}
  .st-screen.front{box-shadow:0 18px 40px -16px #000,0 0 26px -6px rgba(255,212,0,.4)}
  .st-form,.cb-teaser{backdrop-filter:none;-webkit-backdrop-filter:none}
}

/* ==================== v18 WEB DEVELOPMENT PAGE ==================== */
.wdev{--pu:#8B5CFF;--bl:#2E8BFF;--cy:#22D3EE;--neon:linear-gradient(120deg,#8B5CFF,#2E8BFF 60%,#22D3EE)}
.wd-hero{position:relative;overflow:hidden;isolation:isolate}
.wd-bg{position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 60% at 80% 35%,rgba(139,92,255,.26),transparent 70%),radial-gradient(50% 55% at 15% 80%,rgba(46,139,255,.2),transparent 70%),radial-gradient(30% 30% at 50% 10%,rgba(255,212,0,.06),transparent 70%)}
.wd-eb{color:#b9a6ff!important}.wd-eb::before{background:var(--neon)!important}
.wd-h1{font-size:clamp(32px,4.6vw,62px);line-height:1.2;font-weight:800;margin:14px 0 14px;color:#fff;text-shadow:0 0 34px rgba(139,92,255,.45)}
.wd-h1 small{display:block;margin-top:12px;font-size:clamp(13px,1.35vw,18px);font-weight:800;letter-spacing:.1em;line-height:1.45;background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.wd-words{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px;font:800 clamp(14px,1.4vw,19px)/1 inherit;letter-spacing:.12em}
.wd-words span{color:#fff;opacity:.35;animation:wdWord 4s ease-in-out infinite;animation-delay:calc(var(--i)*1s)}
.wd-words span:last-child{color:#FFD400}
@keyframes wdWord{0%,100%{opacity:.35;text-shadow:none}12%,30%{opacity:1;text-shadow:0 0 18px rgba(139,92,255,.9)}}
.wd-btn-neon{background:rgba(139,92,255,.12);color:#fff;border:1px solid rgba(139,92,255,.6);box-shadow:0 0 22px -6px rgba(139,92,255,.9),inset 0 0 18px -8px rgba(46,139,255,.9)}
.wd-btn-neon:hover,.wd-btn-neon:focus-visible{background:rgba(139,92,255,.25);border-color:#a78bff;transform:translateY(-2px)}
.wd-badge{margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;border:1px solid rgba(34,211,238,.45);background:rgba(34,211,238,.07);color:#cfefff;font:700 14px/1.2 inherit;cursor:pointer;transition:.25s}
.wd-badge svg{width:18px;height:18px;color:var(--cy)}.wd-badge:hover,.wd-badge:focus-visible{background:rgba(34,211,238,.14);transform:translateY(-1px)}
/* 3D scene */
.wd-scene{position:relative;height:clamp(340px,36vw,500px);perspective:1400px}
.wd-light{position:absolute;border-radius:50%;filter:blur(50px);opacity:.7}
.wd-light.l1{width:55%;height:55%;top:5%;inset-inline-end:5%;background:rgba(139,92,255,.5)}.wd-light.l2{width:45%;height:45%;bottom:5%;inset-inline-start:5%;background:rgba(46,139,255,.4)}
.wd-stage{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(8deg) rotateY(-14deg);animation:wdFloat 9s ease-in-out infinite}
[dir=rtl] .wd-stage{transform:rotateX(8deg) rotateY(14deg);animation-name:wdFloatR}
@keyframes wdFloat{0%,100%{transform:rotateX(8deg) rotateY(-14deg) translateY(0)}50%{transform:rotateX(5deg) rotateY(-8deg) translateY(-10px)}}
@keyframes wdFloatR{0%,100%{transform:rotateX(8deg) rotateY(14deg) translateY(0)}50%{transform:rotateX(5deg) rotateY(8deg) translateY(-10px)}}
.wd-laptop{position:absolute;left:12%;right:12%;top:14%;transform-style:preserve-3d}
.wd-lid{position:relative;aspect-ratio:16/10;border-radius:14px 14px 4px 4px;padding:2.2%;background:linear-gradient(160deg,#2a2a36,#0d0d14);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -20px #000,0 0 60px -14px rgba(139,92,255,.7)}
.wd-screen{position:relative;height:100%;border-radius:6px;overflow:hidden;background:#07070d;container-type:inline-size}
.wd-screen::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(139,92,255,.1));pointer-events:none}
.wd-site{display:grid;gap:3cqw;padding:3cqw;animation:wdScroll 12s ease-in-out infinite}
@keyframes wdScroll{0%,18%{transform:translateY(0)}45%,62%{transform:translateY(-34%)}88%,100%{transform:translateY(0)}}
.ws-nav{display:flex;align-items:center;gap:2cqw}.ws-nav b{width:10cqw;height:2.6cqw;border-radius:1cqw;background:#FFD400}
.ws-nav i{width:6cqw;height:1.4cqw;border-radius:1cqw;background:rgba(255,255,255,.25)}.ws-nav span{margin-inline-start:auto;width:12cqw;height:4cqw;border-radius:2cqw;background:var(--neon)}
.ws-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:3cqw;align-items:center;padding:3cqw;border-radius:2cqw;background:linear-gradient(135deg,rgba(139,92,255,.35),rgba(46,139,255,.2))}
.ws-hero div{display:grid;gap:1.6cqw}.ws-hero i{display:block;height:2.6cqw;border-radius:1cqw;background:#fff}.ws-hero .t2{width:80%}.ws-hero .t3{width:55%;height:1.6cqw;background:rgba(255,255,255,.5)}
.ws-btn{width:16cqw;height:4.4cqw;border-radius:2.2cqw;background:#FFD400;margin-top:1cqw;animation:wdPulse 2.4s ease-in-out infinite}
@keyframes wdPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,212,0,.6)}50%{box-shadow:0 0 0 1.4cqw rgba(255,212,0,0)}}
.ws-img{aspect-ratio:1;border-radius:2cqw;background:radial-gradient(circle at 35% 30%,#ffe98a,#FFD400 30%,#8B5CFF 75%);box-shadow:inset 0 0 4cqw rgba(0,0,0,.4)}
.ws-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw}.ws-cards i{aspect-ratio:4/3;border-radius:1.6cqw;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1)}
.ws-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw}.ws-strip i{height:6cqw;border-radius:1.2cqw;background:rgba(46,139,255,.25)}
.wd-base{position:relative;height:12px;margin:0 -7%;border-radius:0 0 18px 18px;background:linear-gradient(#3a3a48,#14141c);box-shadow:0 24px 40px -14px #000}
.wd-base i{position:absolute;left:42%;right:42%;top:0;height:5px;border-radius:0 0 6px 6px;background:#0b0b10}
.wd-code{position:absolute;top:2%;inset-inline-start:-2%;width:44%;border-radius:12px;overflow:hidden;transform:translateZ(70px);background:rgba(10,12,30,.82);border:1px solid rgba(34,211,238,.45);box-shadow:0 0 30px -6px rgba(34,211,238,.55),0 20px 40px -18px #000;animation:wdBob 7s ease-in-out infinite}
.wc-bar{display:flex;align-items:center;gap:5px;padding:7px 10px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
.wc-bar i{width:7px;height:7px;border-radius:50%;background:#ff5f57}.wc-bar i:nth-child(2){background:#febc2e}.wc-bar i:nth-child(3){background:#28c840}
.wc-bar span{margin-inline-start:8px;font:600 10px/1 ui-monospace,monospace;color:#8fa3c8}
.wd-code code{display:grid;gap:4px;padding:10px 12px;font:500 clamp(8.5px,.85vw,11px)/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfd8ff;text-align:left}
.wd-code b{font-weight:500;white-space:nowrap;overflow:hidden;width:0;animation:wdType 9s steps(30,end) infinite}
.wd-code b:nth-child(2){animation-delay:.6s}.wd-code b:nth-child(3){animation-delay:1.2s}.wd-code b:nth-child(4){animation-delay:1.8s}.wd-code b:nth-child(5){animation-delay:2.4s}
@keyframes wdType{0%{width:0}10%,85%{width:100%}100%{width:0}}
.wd-code em{font-style:normal}.wd-code .k{color:#c792ea}.wd-code .f{color:#82aaff}.wd-code .c{color:#FFD400}.wd-code .a{color:#89ddff}.wd-code .s{color:#c3e88d}
.wd-phone{position:absolute;bottom:4%;inset-inline-end:2%;width:24%;aspect-ratio:9/18;border-radius:22px;padding:4px;transform:translateZ(110px);background:linear-gradient(160deg,#30303c,#0c0c12);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 50px -18px #000,0 0 40px -10px rgba(46,139,255,.7);animation:wdBob 6s ease-in-out infinite -2s;container-type:inline-size}
.wp-notch{position:absolute;top:7px;left:35%;right:35%;height:9px;border-radius:9px;background:#000;z-index:2}
.wp-ui{height:100%;border-radius:18px;overflow:hidden;background:#f6f4f0;padding:16cqw 7cqw 7cqw;display:grid;gap:5cqw;align-content:start}
.wp-img{aspect-ratio:1;border-radius:7cqw;background:radial-gradient(circle at 40% 35%,#fff,#d9cdf7 45%,#8B5CFF)}
.wp-t{display:block;height:5cqw;border-radius:3cqw;background:#1b1b22}.wp-t.s{width:60%;background:#b9b6c6}
.wp-row{display:flex;align-items:center;justify-content:space-between}.wp-row b{font:800 9cqw/1 inherit;color:#111}
.wp-add{width:18cqw;height:18cqw;border-radius:50%;display:grid;place-items:center;background:#FFD400;color:#000;font:800 12cqw/1 inherit;animation:wdPulse 2.4s ease-in-out infinite}
.wp-dots{display:flex;gap:3cqw;justify-content:center}.wp-dots i{width:4cqw;height:4cqw;border-radius:50%;background:#ccc}.wp-dots i:first-child{background:#8B5CFF}
.wd-store{position:absolute;bottom:10%;inset-inline-start:2%;width:20%;aspect-ratio:1;transform:translateZ(90px) rotateY(-12deg);border-radius:14px;overflow:visible;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 40px -18px #000,0 0 26px -8px rgba(255,212,0,.5);animation:wdBob 8s ease-in-out infinite -4s}
.wsr-awn{height:26%;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,#FFD400 0 14%,#fff 14% 28%)}
.wsr-body{display:grid;grid-template-columns:repeat(3,1fr);gap:8%;padding:12% 10%}.wsr-body i{aspect-ratio:3/4;border-radius:5px;background:linear-gradient(#8B5CFF,#2E8BFF)}
.wsr-cart{position:absolute;top:-10px;inset-inline-end:-10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ff3d71;color:#fff;font:800 12px/1 inherit;box-shadow:0 0 14px rgba(255,61,113,.7)}
.wd-chip{position:absolute;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(12,12,24,.75);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 24px -10px #000,0 0 18px -6px rgba(139,92,255,.7);transform:translateZ(130px);animation:wdBob 5s ease-in-out infinite}
.wd-chip .tl{width:24px;height:24px}
.wd-chip.k0{top:0;inset-inline-end:14%}.wd-chip.k1{top:34%;inset-inline-end:-2%;animation-delay:-1s}.wd-chip.k2{bottom:-2%;inset-inline-start:30%;animation-delay:-2s}.wd-chip.k3{top:44%;inset-inline-start:-4%;animation-delay:-3s}.wd-chip.k4{bottom:30%;inset-inline-end:28%;animation-delay:-4s}
@keyframes wdBob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.wd-floor{position:absolute;left:10%;right:10%;bottom:-2%;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(139,92,255,.45),transparent);filter:blur(10px)}
/* official tech logos via CSS mask (tinted in brand colour) */
.tl{display:inline-block;width:34px;height:34px;flex:none;background:var(--tc,#fff);-webkit-mask:var(--tl) center/contain no-repeat;mask:var(--tl) center/contain no-repeat}
.tl.lg{width:30px;height:30px}
/* services */
.wd-svcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.wd-svc{position:relative;padding:24px;border-radius:22px;background:linear-gradient(160deg,rgba(139,92,255,.1),rgba(255,255,255,.02) 55%);border:1px solid rgba(160,140,255,.22);display:grid;gap:12px;align-content:start;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s}
.wd-svc:not(.has-list){background:linear-gradient(160deg,rgba(46,139,255,.1),rgba(255,255,255,.02) 55%)}
.wd-svcs .wd-svc:nth-child(n+5){grid-column:span 1}
@media(min-width:1021px){.wd-svcs{grid-template-columns:repeat(6,minmax(0,1fr))}.wd-svc.has-list{grid-column:span 3}.wd-svc:not(.has-list){grid-column:span 2}}
.wd-svc:hover,.wd-svc:focus-within{transform:translateY(-4px);border-color:rgba(160,140,255,.6);box-shadow:0 26px 50px -26px rgba(139,92,255,.9)}
.wd-svc-h{display:flex;gap:14px;align-items:center}
.wd-svc-ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#c8b9ff;background:rgba(139,92,255,.14);border:1px solid rgba(139,92,255,.35);box-shadow:0 0 20px -8px rgba(139,92,255,.9)}
.wd-svc-ic svg{width:26px;height:26px}
.wd-svc h3{font-size:19px;color:#fff;line-height:1.35}.wd-svc-h small{color:#8f93b8;font-size:12px}
.wd-svc p{color:#b3b6d4;margin:0;line-height:1.8}
.wd-list summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#c8b9ff;font-size:14px;padding:6px 0}
.wd-list summary::-webkit-details-marker{display:none}
.wd-list summary span{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(139,92,255,.2)}
.wd-list[open] summary{margin-bottom:6px}
.wd-list ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.wd-list li{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:#dfe1f2}.wd-list li svg{width:16px;height:16px;flex:none;color:#FFD400;margin-top:3px}
/* tech showcase */
.wd-tg{font-size:15px;color:#b9a6ff;letter-spacing:.04em;margin:26px 0 12px}
.wd-tech{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.wd-t{display:grid;justify-items:center;gap:10px;padding:18px 10px 14px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 30px -20px #000;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.wd-t .tl{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--tc) 45%,transparent))}
.wd-t span{font:700 13px/1.2 inherit;color:#e8e9f5;text-align:center}
.wd-t:hover{transform:translateY(-6px) rotateX(8deg);border-color:color-mix(in srgb,var(--tc) 60%,transparent);box-shadow:0 20px 40px -20px #000,0 0 26px -8px color-mix(in srgb,var(--tc) 70%,transparent)}
.wd-note{margin-top:18px;color:#8a8fb0;font-size:13px}
/* delivery timeline */
.wd-del-head{display:flex;gap:26px;align-items:center;margin-bottom:34px}
.wd-del-num{flex:none;display:grid;justify-items:center;padding:18px 22px;border-radius:24px;background:linear-gradient(160deg,rgba(139,92,255,.3),rgba(46,139,255,.18));border:1px solid rgba(160,140,255,.5);box-shadow:0 0 40px -10px rgba(139,92,255,.9);transform:perspective(600px) rotateY(-10deg)}
[dir=rtl] .wd-del-num{transform:perspective(600px) rotateY(10deg)}
.wd-del-num b{font:900 clamp(40px,5vw,64px)/1 inherit;color:#fff;text-shadow:0 0 24px rgba(139,92,255,.9)}.wd-del-num span{font-weight:700;color:#cfd2ea;font-size:13px}
.wd-rail{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;position:relative;perspective:900px}
.wd-rail::before{content:"";position:absolute;top:13px;inset-inline:6%;height:2px;background:linear-gradient(90deg,var(--pu),var(--bl),var(--cy));box-shadow:0 0 14px rgba(46,139,255,.8)}
.wd-rail li{position:relative;padding:44px 16px 18px;border-radius:18px;background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.1);transform:rotateX(10deg);transform-origin:top;transition:transform .35s,border-color .35s}
.wd-rail li:hover{transform:rotateX(0) translateY(-4px);border-color:rgba(34,211,238,.5)}
.wd-node{position:absolute;top:6px;inset-inline-start:16px;width:16px;height:16px;border-radius:50%;background:#07070d;border:3px solid var(--cy);box-shadow:0 0 14px var(--cy)}
.wd-day{display:inline-block;font:800 12px/1 inherit;letter-spacing:.08em;color:#FFD400;margin-bottom:8px}
.wd-rail h3{font-size:16px;color:#fff;margin-bottom:6px}.wd-rail p{font-size:13.5px;color:#a9acc8;margin:0;line-height:1.7}
.wd-cond{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.wd-cond li{display:flex;gap:10px;align-items:flex-start;color:#cfd2ea;font-size:14px;padding:12px 14px;border-radius:14px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.2)}
.wd-cond svg{width:18px;height:18px;flex:none;color:var(--cy);margin-top:2px}
/* pricing */
.wd-price{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.wd-price .h2{font-size:clamp(22px,2.4vw,32px);line-height:1.5}.wd-price .mut{margin:14px 0 22px}
.wd-factors{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wd-factors li{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#e8e9f5;font-weight:600;font-size:14.5px}
.wd-factors span{font:800 11px/1 inherit;color:#b9a6ff;padding:5px 7px;border-radius:8px;background:rgba(139,92,255,.16)}
.wd-recv{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 18px}
.wd-recv li{display:flex;gap:10px;align-items:flex-start}.wd-recv svg{width:18px;height:18px;flex:none;color:#FFD400;margin-top:3px}
/* process */
.wd-proc{display:grid;gap:20px}
.wd-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;position:relative}
.wd-step{position:relative;display:grid;gap:4px;justify-items:start;text-align:start;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#cfd2ea;cursor:pointer;font:inherit;transition:.3s}
.wd-step b{font-size:15px;color:#fff}.wd-step small{font-size:10.5px;letter-spacing:.08em;color:#8f93b8}
.wd-sn{font:800 20px/1 inherit;color:rgba(255,255,255,.35)}
.wd-step.done{border-color:rgba(139,92,255,.35)}.wd-step.done .wd-sn{color:#b9a6ff}
.wd-step.on{border-color:transparent;background:linear-gradient(135deg,rgba(139,92,255,.45),rgba(46,139,255,.3));box-shadow:0 14px 30px -14px rgba(139,92,255,.9);transform:translateY(-4px)}
.wd-step.on .wd-sn{color:#FFD400}
.wd-step:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.wd-panel{perspective:1000px;outline:none}
.wd-pcard{display:flex;gap:26px;align-items:center;padding:28px;border-radius:24px;background:linear-gradient(135deg,rgba(20,16,40,.9),rgba(10,14,32,.9));border:1px solid rgba(160,140,255,.35);box-shadow:0 30px 60px -30px rgba(139,92,255,.8);animation:wdCard .5s cubic-bezier(.2,.8,.2,1)}
@keyframes wdCard{from{opacity:0;transform:rotateX(-18deg) translateY(12px)}to{opacity:1;transform:none}}
.wd-pn{flex:none;font:900 clamp(52px,6vw,84px)/1 inherit;background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(139,92,255,.5))}
.wd-pcard small{letter-spacing:.12em;color:#8fa3c8;font-weight:700}.wd-pcard h3{font-size:24px;color:#fff;margin:6px 0}.wd-pcard p{color:#cfd2ea;margin:0 0 14px}
.wd-pbar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.wd-pbar i{display:block;height:100%;background:var(--neon);transition:width .5s}
/* portfolio */
.wd-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.wd-f{font:700 14px/1 inherit;color:#cfd2ea;padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.25s}
.wd-f:hover,.wd-f:focus-visible{border-color:#a78bff;color:#fff}.wd-f.on{background:var(--neon);border-color:transparent;color:#fff}
.wd-works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.wd-work{border-radius:22px;overflow:hidden;background:#0a0a10;border:1px solid rgba(255,255,255,.1);transition:transform .35s,border-color .35s,box-shadow .35s;display:grid}
.wd-work[hidden]{display:none}
.wd-work:hover{transform:translateY(-5px);border-color:rgba(160,140,255,.5);box-shadow:0 30px 60px -32px rgba(139,92,255,.9)}
.wd-prev{position:relative;padding:18px 18px 0;background:radial-gradient(70% 80% at 50% 0,rgba(139,92,255,.25),transparent),#07070d;max-height:300px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.wd-prev .browser{transform:perspective(1200px) rotateX(10deg);transform-origin:top;transition:transform .5s}
.wd-work:hover .wd-prev .browser{transform:perspective(1200px) rotateX(0) translateY(-4%)}
.wd-cb{position:absolute;top:28px;inset-inline-end:28px;z-index:3;font:800 10.5px/1 inherit;letter-spacing:.06em;padding:7px 10px;border-radius:999px;color:#fff;background:rgba(10,10,20,.75);border:1px solid rgba(255,212,0,.55);backdrop-filter:blur(6px)}
.wd-wb{padding:18px 22px 22px;display:grid;gap:10px;align-content:start}
.wd-wcat{justify-self:start;font:700 11.5px/1 inherit;padding:6px 10px;border-radius:999px;color:#c8b9ff;background:rgba(139,92,255,.14);border:1px solid rgba(139,92,255,.3)}
.wd-wb h3{color:#fff;font-size:19px}.wd-wb h3 .mut{font-weight:500;font-size:15px}.wd-wb p{color:#a9acc8;margin:0;line-height:1.75;font-size:14.5px}
.wd-stack{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.wd-stack small{color:#8f93b8;font-size:12px;margin-inline-end:4px}
.wd-stack span{font:600 12px/1 inherit;padding:6px 9px;border-radius:8px;background:rgba(46,139,255,.12);color:#cfe3ff;border:1px solid rgba(46,139,255,.28)}
.wd-wa{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.wd-wa .btn{padding-block:12px}
/* form */
.wd-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wd-form .full{grid-column:1/-1}
.wd-feats{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.wd-feats legend{font-weight:600;margin-bottom:10px;font-size:14px;padding:0}
.wd-chk{position:relative;cursor:pointer}.wd-chk input{position:absolute;opacity:0;width:1px;height:1px}
.wd-chk span{display:inline-block;padding:9px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.03);font-size:13.5px;transition:.2s}
.wd-chk input:checked+span{background:rgba(139,92,255,.25);border-color:#a78bff;color:#fff;box-shadow:0 0 16px -6px rgba(139,92,255,.9)}
.wd-chk input:focus-visible+span{outline:2px solid var(--cy);outline-offset:2px}
/* CTA */
.wd-cta{position:relative;overflow:hidden;border-radius:30px;padding:clamp(36px,5vw,70px);text-align:center;display:grid;justify-items:center;gap:14px;background:#07070d;border:1px solid rgba(160,140,255,.4)}

function bindForm() {
  const f = $('#leadForm'); if (!f) return;
  const setErr = (id, msg) => { const e = $('#e-' + id); if (e) e.textContent = msg || ''; const fld = (id === 'services' ? $('#g-services') : $('#f-' + id)?.closest('.fld')); fld && fld.classList.toggle('bad', !!msg); const inp = $('#f-' + id); inp && inp.setAttribute('aria-invalid', msg ? 'true' : 'false'); };
  const validate = () => {
    const d = Object.fromEntries(new FormData(f)); d.services = new FormData(f).getAll('services'); let ok = true;
    ['name', 'company', 'industry', 'budget', 'country'].forEach(k => { const bad = !String(d[k] || '').trim(); setErr(k, bad ? L(UI.f.req) : ''); if (bad) ok = false; });
    const em = String(d.email || '').trim(); const emBad = !em ? L(UI.f.req) : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em) ? L(UI.f.badEmail) : ''; setErr('email', emBad); if (emBad) ok = false;
    const ph = String(d.phone || '').replace(/[\s-]/g, '').replace(/^0+/, ''); const phBad = !ph ? L(UI.f.req) : !/^\d{7,12}$/.test(ph) || (d.cc === '+966' && !/^5\d{8}$/.test(ph)) ? L(UI.f.badPhone) : ''; setErr('phone', phBad); if (phBad) ok = false;
    setErr('services', d.services.length ? '' : L(UI.f.pickOne)); if (!d.services.length) ok = false;
    return ok ? { ...d, phone: d.cc + ph, lang, page: location.hash || '#home' } : null;
  };
  f.addEventListener('input', e => { if (e.target.closest('.bad')) validate(); });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const st = $('#fStatus'), btn = $('#fSend'); st.className = 'status'; st.textContent = '';
    const data = validate();
    if (!data) { st.className = 'status no'; st.textContent = L(UI.f.fix); f.querySelector('[aria-invalid=true], .bad input')?.focus(); return; }
    btn.disabled = true; const label = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>${L(UI.f.sending)}`;
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(CONFIG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data), signal: ctrl.signal });
      let j = null; try { j = await res.json() } catch (x) {}
      if (!res.ok || !j || j.ok !== true) throw new Error((j && j.error) || 'HTTP ' + res.status);
      st.className = 'status ok'; st.textContent = L(UI.f.ok); f.reset(); f.querySelectorAll('input,select,textarea,button').forEach(el => el.disabled = true);
    } catch (err) {
      console.warn('[contact] submit failed:', err.message);
      st.className = 'status no'; st.innerHTML = esc(L(UI.f.fail)) + (CONFIG.whatsapp ? ` <a href="${waLink()}" target="_blank" rel="noopener noreferrer" data-wa style="text-decoration:underline">${L(UI.whatsapp)}</a>` : '') + (CONFIG.email ? ` · <span dir="ltr">${esc(CONFIG.email)}</span>` : '');
      btn.disabled = false; btn.innerHTML = label;
    } finally { clearTimeout(to); }
  });
}
